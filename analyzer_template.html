<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Policy Analyzer</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js" charset="utf-8"></script>
<style>
  :root {
    --bg:     #111827;
    --panel:  #1f2937;
    --border: #374151;
    --text:   #f3f4f6;
    --muted:  #9ca3af;
    --blue:   #60a5fa;
    --green:  #34d399;
    --yellow: #fbbf24;
    --red:    #f87171;
    --accent: #c46a6a;        /* soothing dark red — branding + active state */
    --accent-dim: #8f4a4a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 12px/1.4 ui-monospace, monospace;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }

  /* ── header ── */
  #hdr {
    flex-shrink: 0;
    background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 0; padding: 0 12px;
    height: 36px;
  }
  .logo {
    background-image: url('./assets/logo.png');
    background-repeat: no-repeat; background-position: left center;
    background-size: contain; display: inline-block; align-items: center;
    width: 131px; height: 24px; margin-right: 20px;
  }
  .tab-btn {
    background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); cursor: pointer; font: inherit; font-size: 12px;
    padding: 0 12px; height: 36px; transition: color .15s;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
  #session-info {
    margin-left: auto; color: var(--muted); font-size: 11px;
  }

  /* ── panes ── */
  .pane { display: flex; flex: 1; min-height: 0; }

  /* ── configure pane ── */
  #pane-cfg {
    flex-direction: column; padding: 28px 40px; overflow-y: auto;
  }
  .form-section { max-width: 440px; }
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block; color: var(--muted); font-size: 11px; margin-bottom: 4px;
  }
  .form-group select, .form-group input[type=number] {
    width: 100%; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); padding: 6px 8px; border-radius: 4px; font: inherit;
    appearance: auto;
  }
  .form-row { display: flex; gap: 12px; }
  .form-row .form-group { flex: 1; }

  /* collapsible policy dropdown */
  .dropdown { position: relative; }
  .dd-toggle {
    width: 100%; text-align: left; background: var(--panel);
    border: 1px solid var(--border); color: var(--text);
    padding: 6px 8px; border-radius: 4px; font: inherit; cursor: pointer;
  }
  .dd-toggle::after { content: '▾'; float: right; color: var(--muted); }
  .dd-panel {
    display: none; position: absolute; z-index: 20; top: 100%; left: 0; right: 0;
    margin-top: 2px; max-height: 320px; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
  }
  .dropdown.open .dd-panel { display: block; }
  .dd-group > summary {
    list-style: none; cursor: pointer; padding: 6px 8px;
    color: var(--muted); font-size: 11px; font-weight: 600;
    border-top: 1px solid var(--border); user-select: none;
  }
  .dd-group:first-child > summary { border-top: none; }
  .dd-group > summary::-webkit-details-marker { display: none; }
  .dd-group > summary::before { content: '▸ '; }
  .dd-group[open] > summary::before { content: '▾ '; }
  .dd-group > summary:hover { color: var(--text); }
  .dd-opt {
    padding: 5px 8px 5px 20px; cursor: pointer; font-size: 12px;
  }
  .dd-opt:hover { background: var(--border); }
  .dd-opt.sel { color: var(--accent, #2563eb); }
  #run-btn {
    background: #2563eb; color: #fff; border: none;
    padding: 8px 22px; border-radius: 4px; cursor: pointer; font: inherit;
    margin-top: 6px;
  }
  #run-btn:hover:not(:disabled) { background: #1d4ed8; }
  #run-btn:disabled { background: var(--border); color: var(--muted); cursor: default; }

  /* ── session pane ── */
  #pane-ses {
    display: none; flex-direction: row;
  }
  #ses-sidebar {
    width: 190px; flex-shrink: 0;
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #ses-sidebar-top {
    padding: 8px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    display: flex; gap: 6px; align-items: center;
  }
  #ses-sidebar-top select {
    flex: 1; min-width: 0;
    background: var(--panel); border: 1px solid var(--border);
    color: var(--text); padding: 4px 6px; border-radius: 3px; font: inherit;
    font-size: 11px;
  }
  #del-btn {
    flex-shrink: 0;
    background: none; border: 1px solid var(--border); border-radius: 3px;
    color: var(--muted); cursor: pointer; font: inherit; font-size: 12px;
    padding: 3px 6px; line-height: 1;
  }
  #del-btn:hover { color: var(--red); border-color: var(--red); }
  #rollout-list { flex: 1; overflow-y: auto; padding: 6px; }
  .ritem {
    padding: 4px 6px; margin: 1px 0; border-radius: 3px;
    display: flex; align-items: center; gap: 6px; font-size: 11px;
  }
  .ritem a { color: inherit; text-decoration: none; }
  .ritem a:hover { text-decoration: underline; }
  .ritem.pending { color: var(--muted); }
  .ritem.running { color: var(--yellow); }
  .ritem.done    { color: var(--green); }
  .ritem.error   { color: var(--red); }
  .ritem .rname  { flex: 1; }
  .ritem .rtag   { font-size: 10px; color: var(--muted); }

  /* ── aggregate content ── */
  #ses-main {
    flex: 1; overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .agg-row { display: flex; gap: 8px; }
  .agg-chart {
    flex: 1; min-width: 0; height: 200px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
  }
  #stat-bar {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 8px 10px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 4px; font-size: 11px;
  }
  .stat-item { display: flex; flex-direction: column; gap: 2px; }
  .stat-label { color: var(--muted); font-size: 10px; }
  .stat-val { color: var(--text); font-size: 13px; font-weight: 600; }

  .rdetail {
    font-size: 10px; color: var(--yellow);
    padding: 1px 6px 3px 22px; line-height: 1.3;
  }

  #session-tags {
    flex-shrink: 0; border-top: 1px solid var(--border);
    padding: 8px; display: flex; flex-direction: column; gap: 3px;
  }
  #session-tags .strow { display: flex; gap: 6px; font-size: 10px; line-height: 1.4; }
  #session-tags .stkey { color: var(--muted); flex-shrink: 0; width: 64px; }
  #session-tags .stval { color: var(--text); word-break: break-word; }

  /* ── empty states ── */
  .empty { color: var(--muted); padding: 20px; font-size: 11px; }

  /* ── view switcher ── */
  #ses-main { padding: 0; }
  #view-tabs {
    flex-shrink: 0; display: flex; gap: 0; align-items: center;
    border-bottom: 1px solid var(--border); padding: 0 8px;
  }
  .view-btn {
    background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); cursor: pointer; font: inherit; font-size: 11px;
    padding: 6px 12px; transition: color .15s;
  }
  .view-btn:hover { color: var(--text); }
  .view-btn.active { color: var(--text); border-bottom-color: var(--accent); }
  .view {
    flex: 1; min-height: 0; overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  #view-rollout { padding: 0; }
  #rollout-frame { flex: 1; width: 100%; border: none; background: var(--bg); }

  /* ── video grid (top of the Aggregate view) ── */
  #video-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px; align-content: start;
  }
  #video-grid:empty { display: none; }
  .vtile {
    background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
    overflow: hidden;
  }
  .vtile.done { cursor: pointer; }
  .vtile .vframe {
    position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000;
    display: flex; align-items: center; justify-content: center;
  }
  .vtile .vframe img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: none;
  }
  .vtile.ready .vframe img { display: block; }
  .vstatus { color: var(--muted); font-size: 10px; text-align: center; padding: 6px; }
  .vtile.running .vstatus { color: var(--yellow); }
  .vtile.error   .vstatus { color: var(--red); }
  .vtile .vlabel {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 8px; font-size: 11px; color: var(--text);
  }
  .vtile .vlabel .vtag { color: var(--muted); font-size: 10px; }

  /* ── compare pane ── */
  #pane-cmp { display: none; flex-direction: row; }
  #cmp-sidebar {
    width: 280px; flex-shrink: 0; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #cmp-sidebar-top {
    padding: 8px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    display: flex; align-items: center; gap: 6px;
    color: var(--muted); font-size: 11px;
  }
  #cmp-sidebar-top .spacer { margin-left: auto; }
  #cmp-refresh {
    background: none; border: 1px solid var(--border); border-radius: 3px;
    color: var(--muted); cursor: pointer; font: inherit; font-size: 11px;
    padding: 2px 6px; line-height: 1;
  }
  #cmp-refresh:hover { color: var(--text); border-color: var(--muted); }
  #queue-search-wrap {
    padding: 6px 8px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  #queue-search {
    width: 100%; box-sizing: border-box;
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 4px 7px; border-radius: 3px; font: inherit; font-size: 11px;
  }
  #queue-search::placeholder { color: var(--muted); }
  #queue-list { flex: 1; overflow-y: auto; padding: 8px; }
  .qsection {
    font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); padding: 4px 2px 2px; margin-top: 4px;
  }
  .qsection:first-child { margin-top: 0; }
  .qgroup { margin-bottom: 10px; }
  .qhead {
    display: flex; align-items: baseline; gap: 6px; cursor: pointer;
    padding: 3px 2px; color: var(--text); font-size: 11px;
  }
  .qhead:hover { color: var(--blue); }
  .qhead .qname { font-weight: 600; word-break: break-all; }
  .qhead .qcount { color: var(--muted); font-size: 10px; flex-shrink: 0; }
  .qhead .qtwist { color: var(--muted); width: 10px; flex-shrink: 0; }
  .qhead .qpin {
    margin-left: auto; flex-shrink: 0; cursor: pointer; color: var(--muted);
    font-size: 12px; line-height: 1;
  }
  .qhead .qpin:hover { color: var(--text); }
  .qhead .qpin.on { color: var(--accent); }
  .qpolicies { padding: 4px 0 4px 6px; display: none; }
  .qgroup.open .qpolicies { display: block; }

  /* stacked-sheets policy card */
  .pcard {
    position: relative; margin: 5px 4px 5px 0;
    background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
  }
  .pcard.stacked::before, .pcard.stacked::after {
    content: ''; position: absolute; inset: 0; z-index: -1;
    background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
  }
  .pcard.stacked::before { transform: translate(3px, 3px); opacity: .7; }
  .pcard.stacked.deep::after { transform: translate(6px, 6px); opacity: .45; }
  .pcard-head {
    display: flex; align-items: center; gap: 7px; padding: 6px 8px;
    cursor: pointer; font-size: 11px;
  }
  .pcard-head input { cursor: pointer; flex-shrink: 0; }
  .pcard.selected { border-color: var(--accent); }
  .pcard-label { flex: 1; min-width: 0; word-break: break-all; }
  .pcard-bundle { color: var(--blue); font-size: 10px; }
  .pcard-badge {
    flex-shrink: 0; color: var(--muted); font-size: 10px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 1px 7px;
  }
  .pcard-twist { color: var(--muted); width: 9px; flex-shrink: 0; font-size: 9px; }
  .pcard-seeds { display: none; padding: 0 8px 6px 24px; }
  .pcard.open .pcard-seeds { display: block; }
  .seedrow {
    display: flex; align-items: center; gap: 6px;
    font-size: 10px; color: var(--muted); padding: 2px 0;
  }
  .seedrow .seedcb { width: 12px; height: 12px; margin: 0; flex-shrink: 0; cursor: pointer; }
  .seedrow .seedcb:disabled { cursor: default; }
  .seedrow .sdot { flex-shrink: 0; }
  .seedrow.ok .sdot { color: var(--green); }
  .seedrow.failed .sdot { color: var(--red); }
  .seedrow .sname { flex: 1; min-width: 0; word-break: break-all; }
  .seedrow .sopen {
    flex-shrink: 0; color: var(--blue); cursor: pointer; text-decoration: none;
  }
  .seedrow .sopen:hover { text-decoration: underline; }
  .seedrow.failed .sopen { color: var(--border); cursor: default; pointer-events: none; }

  #cmp-main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  #cmp-controls {
    flex-shrink: 0; border-bottom: 1px solid var(--border);
    padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
  }
  .cmp-field { display: flex; flex-direction: column; gap: 3px; }
  .cmp-field label { color: var(--muted); font-size: 10px; }
  .cmp-field select, .cmp-field input {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 4px 6px; border-radius: 3px; font: inherit; font-size: 11px;
  }
  .cmp-field input[type=number] { width: 70px; }
  #cmp-smode { max-width: 230px; }
  .cmp-field.chk { flex-direction: row; align-items: center; gap: 5px; }
  #cmp-gen {
    background: #2563eb; color: #fff; border: none;
    padding: 7px 18px; border-radius: 4px; cursor: pointer; font: inherit;
  }
  #cmp-gen:hover:not(:disabled) { background: #1d4ed8; }
  #cmp-gen:disabled { background: var(--border); color: var(--muted); cursor: default; }
  #cmp-dl, #cmp-dl-data {
    background: transparent; color: var(--text); border: 1px solid var(--border);
    padding: 7px 14px; border-radius: 4px; cursor: pointer; font: inherit;
  }
  #cmp-dl:hover:not(:disabled), #cmp-dl-data:hover:not(:disabled) {
    border-color: var(--muted); background: var(--panel);
  }
  #cmp-dl:disabled, #cmp-dl-data:disabled { color: var(--muted); cursor: default; }
  #cmp-status { flex-shrink: 0; padding: 6px 12px; font-size: 11px; color: var(--muted); min-height: 0; }
  #cmp-status.err { color: var(--red); }
  #cmp-chart { flex: 1; min-height: 0; margin: 0 8px 8px; }
</style>
</head>
<body>

<div id="hdr">
  <span class="logo"></span>
  <button class="tab-btn active" id="tab-cfg" onclick="switchTab('cfg')">Configure</button>
  <button class="tab-btn" id="tab-ses" onclick="switchTab('ses')">Session</button>
  <button class="tab-btn" id="tab-cmp" onclick="switchTab('cmp')">Compare</button>
  <span id="session-info"></span>
</div>

<!-- Configure pane -->
<div class="pane" id="pane-cfg">
  <div class="form-section">
    <div class="form-group">
      <label>Policy</label>
      <div class="dropdown" id="run-dd">
        <button type="button" class="dd-toggle" id="run-dd-toggle" onclick="toggleRunDD(event)">Loading…</button>
        <div class="dd-panel" id="run-dd-panel"></div>
      </div>
      <input type="hidden" id="run-sel">
    </div>
    <div class="form-group">
      <label>Checkpoint</label>
      <select id="ckpt-sel">
        <option value="latest">latest</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Deterministic rollouts</label>
        <input type="number" id="n-det" value="3" min="0" max="20">
      </div>
      <div class="form-group">
        <label>Stochastic rollouts</label>
        <input type="number" id="n-sto" value="3" min="0" max="20">
      </div>
    </div>
    <button id="run-btn" onclick="onRunClick()">▶ Run Analysis</button>
  </div>
</div>

<!-- Session pane -->
<div class="pane" id="pane-ses">
  <div id="ses-sidebar">
    <div id="ses-sidebar-top">
      <select id="session-sel" onchange="onSessionChange()">
        <option value="">No sessions</option>
      </select>
      <button id="del-btn" title="Delete session" onclick="onDeleteClick()">🗑</button>
    </div>
    <div id="rollout-list"><div class="empty">No rollouts</div></div>
    <div id="session-tags"></div>
  </div>
  <div id="ses-main">
    <div id="view-tabs">
      <button class="view-btn active" data-view="aggregate" onclick="showView('aggregate')">Aggregate</button>
      <button class="view-btn" id="view-btn-rollout" data-view="rollout" style="display:none" onclick="showView('rollout')"></button>
    </div>

    <div class="view" id="view-aggregate">
      <div class="empty" id="agg-empty">Start a session to see aggregate stats.</div>
      <div id="video-grid"></div>
      <div id="stat-bar" style="display:none"></div>
      <div class="agg-row" style="display:none" id="reward-row">
        <div class="agg-chart" id="reward-chart"></div>
      </div>
      <div class="agg-row" style="display:none" id="reward-terms-row">
        <div class="agg-chart" id="reward-terms-chart"></div>
      </div>
    </div>

    <div class="view" id="view-rollout" style="display:none">
      <iframe id="rollout-frame" title="rollout analysis"></iframe>
    </div>
  </div>
</div>

<!-- Compare pane -->
<div class="pane" id="pane-cmp">
  <div id="cmp-sidebar">
    <div id="cmp-sidebar-top">
      <span>Recent queues</span>
      <span class="spacer"></span>
      <button id="cmp-refresh" onclick="loadQueues(true)">↻</button>
    </div>
    <div id="queue-search-wrap">
      <input id="queue-search" type="search" placeholder="Search queues…"
             oninput="onQueueSearch(this.value)">
    </div>
    <div id="queue-list"><div class="empty">Loading…</div></div>
  </div>
  <div id="cmp-main">
    <div id="cmp-controls">
      <div class="cmp-field">
        <label>Mode</label>
        <select id="cmp-mode">
          <option value="det">deterministic</option>
          <option value="sto">stochastic</option>
        </select>
      </div>
      <div class="cmp-field">
        <label>Benchmark</label>
        <select id="cmp-benchmark" title="Environment-config preset to evaluate against">
          <option value="default">Default (training config)</option>
        </select>
      </div>
      <div class="cmp-field">
        <label>Rollouts / seed</label>
        <input type="number" id="cmp-nroll" value="50" min="1" max="512">
      </div>
      <div class="cmp-field">
        <label>Success channel</label>
        <select id="cmp-channel"><option value="">—</option></select>
      </div>
      <div class="cmp-field chk">
        <input type="checkbox" id="cmp-abs">
        <label for="cmp-abs">abs</label>
      </div>
      <div class="cmp-field">
        <label>Criterion</label>
        <select id="cmp-smode" onchange="onSuccessModeChange()">
          <option value="hold">error within thresh for hold steps</option>
          <option value="average">avg rollout error below thresh</option>
          <option value="average_above">mean success metric above thresh</option>
        </select>
      </div>
      <div class="cmp-field">
        <label>Sweep min</label>
        <input type="number" id="cmp-smin" step="any" value="0">
      </div>
      <div class="cmp-field">
        <label>Sweep max</label>
        <input type="number" id="cmp-smax" step="any" value="1">
      </div>
      <div class="cmp-field">
        <label>Points</label>
        <input type="number" id="cmp-npts" value="151" min="2" max="501">
      </div>
      <div class="cmp-field" id="cmp-hold-field">
        <label>Hold steps</label>
        <input type="number" id="cmp-hold" value="10" min="1">
      </div>
      <div class="cmp-field" id="cmp-skip-field" style="display:none">
        <label>Skip first (s)</label>
        <input type="number" id="cmp-skip" step="any" value="0" min="0">
      </div>
      <button id="cmp-gen" onclick="onGenerateCompare()">▶ Generate</button>
      <button id="cmp-dl" onclick="downloadCompareChart()" disabled>⬇ PNG</button>
      <button id="cmp-dl-data" onclick="downloadCompareData()" disabled>⬇ CSV</button>
    </div>
    <div id="cmp-status"></div>
    <div id="cmp-chart"></div>
  </div>
</div>

<script>
'use strict';

// ── constants ─────────────────────────────────────────────────────────────────
const COLORS = [
  '#60a5fa','#34d399','#fbbf24','#f87171','#a78bfa','#fb923c',
  '#4ade80','#38bdf8','#e879f9','#facc15','#f472b6','#67e8f9',
];
const plotCfg = {responsive: true, displayModeBar: false};

function basePlotLayout(title) {
  return {
    title: {text: title, font: {size: 11, color: '#9ca3af'}},
    paper_bgcolor: '#1f2937', plot_bgcolor: '#111827',
    font: {color: '#f3f4f6', size: 10},
    margin: {l: 44, r: 8, t: 28, b: 36},
    xaxis: {title: 't (s)', gridcolor: '#374151', titlefont: {size: 10}},
    yaxis: {gridcolor: '#374151'},
    legend: {font: {size: 9}},
    showlegend: true,
  };
}

// ── state ─────────────────────────────────────────────────────────────────────
let currentSession = null;   // {session_id, run, rollouts, n_done, n_total}
let rolloutData = {};        // {rollout_name: data.json contents}
let evtSource = null;        // EventSource for live session updates
let knownSessions = [];      // list[dict] from /api/sessions
let currentView = 'aggregate';   // 'aggregate' | 'rollout'
let openRolloutName = null;      // rollout shown in the embedded iframe
const videoAnims = {};           // rollout_name -> {timer, idx, T, blobs}

// Resize every aggregate Plotly chart — needed because Plotly measures the
// container at creation time, and a chart drawn while its tab/view was hidden
// (zero size) otherwise stays blank until a window resize.
function resizeAggregateCharts() {
  const ids = ['reward-chart', 'reward-terms-chart'];
  for (const id of ids) {
    const el = document.getElementById(id);
    if (el && el.data) { try { Plotly.Plots.resize(el); } catch (_) {} }
  }
}

// ── view switching (within the session pane) ────────────────────────────────────
function showView(view) {
  currentView = view;
  for (const el of document.querySelectorAll('.view-btn')) {
    el.classList.toggle('active', el.dataset.view === view);
  }
  document.getElementById('view-aggregate').style.display = view === 'aggregate' ? 'flex' : 'none';
  document.getElementById('view-rollout').style.display   = view === 'rollout'   ? 'flex' : 'none';
  if (view === 'aggregate') {
    renderVideoGrid();
    setTimeout(resizeAggregateCharts, 50);
  }
  // Previews keep looping from cached blobs even when hidden — cheap (no network),
  // and avoids re-fetching every frame when you switch back. They're only torn
  // down on a session switch (resetSessionViews → destroyVideoAnims).
}

function openRollout(name) {
  if (!currentSession) return;
  openRolloutName = name;
  const btn = document.getElementById('view-btn-rollout');
  btn.style.display = '';
  btn.textContent = name;
  const frame = document.getElementById('rollout-frame');
  const src = `/sessions/${currentSession.session_id}/${name}/`;
  if (frame.getAttribute('src') !== src) frame.setAttribute('src', src);
  showView('rollout');
}

// ── video grid ──────────────────────────────────────────────────────────────────
// One reserved tile per rollout, created up front. Each fills with a looping
// preview once its rollout completes. Frames are preloaded once into in-memory
// blob URLs so playback never re-hits the network (smooth even over SSH).
function destroyVideoAnims() {
  for (const k of Object.keys(videoAnims)) {
    const a = videoAnims[k];
    if (a.timer) clearInterval(a.timer);
    if (a.blobs) a.blobs.forEach(u => { if (u && u.startsWith('blob:')) URL.revokeObjectURL(u); });
    delete videoAnims[k];
  }
}
// Back-compat alias (used by reset paths).
const stopAllVideoAnims = destroyVideoAnims;

const STATUS_TEXT = {pending: 'queued', running: 'running…', error: 'failed', done: ''};

// Pre-order tiles so det/sto of the same seed sit next to each other: group by
// seed (parsed from the `{det,sto}_<seed>` name), det before sto within a seed.
// Names without a parseable seed keep their original relative order at the end.
function orderedRollouts(rollouts) {
  return rollouts
    .map((r, i) => {
      const m = /_(\d+)$/.exec(r.name);
      return {r, i, seed: m ? +m[1] : Infinity, det: r.deterministic ? 0 : 1};
    })
    .sort((a, b) =>
      a.seed - b.seed || a.det - b.det || a.i - b.i)
    .map(x => x.r);
}

function renderVideoGrid() {
  if (!currentSession) return;
  const grid = document.getElementById('video-grid');
  const sid = currentSession.session_id;
  const rollouts = orderedRollouts(currentSession.rollouts);

  if (rollouts.length === 0) {
    destroyVideoAnims();
    grid.innerHTML = '';   // empty grid is hidden via #video-grid:empty
    return;
  }

  for (const r of rollouts) {
    // Reserve the tile up front (in session order), regardless of status.
    let tile = document.getElementById(`vtile-${r.name}`);
    if (!tile) {
      tile = document.createElement('div');
      tile.id = `vtile-${r.name}`;
      const tag = r.deterministic ? 'det' : 'sto';
      tile.innerHTML = `
        <div class="vframe"><img alt="${r.name}"><div class="vstatus"></div></div>
        <div class="vlabel"><span>${r.name}</span><span class="vtag">${tag}</span></div>`;
      grid.appendChild(tile);
    }

    // Reflect current status on the placeholder (preserve 'ready' once the
    // preview is playing, so re-renders don't hide the video).
    const ready = videoAnims[r.name] && videoAnims[r.name].blobs ? ' ready' : '';
    tile.className = 'vtile ' + r.status + ready;
    const statusEl = tile.querySelector('.vstatus');
    statusEl.textContent = r.detail
      || (r.status === 'error' ? (r.error || 'failed').slice(0, 60) : STATUS_TEXT[r.status] || '');
    tile.onclick = r.status === 'done' ? () => openRollout(r.name) : null;

    // Once done and its data is available, preload frames + start the loop.
    if (r.status === 'done' && !videoAnims[r.name] && rolloutData[r.name]) {
      startTilePlayback(sid, r, tile);
    }
  }
}

async function startTilePlayback(sid, r, tile) {
  const data = rolloutData[r.name];
  const T = data && data.meta ? data.meta.T : 0;
  const dt = data && data.meta ? data.meta.dt : 0.04;
  if (!T) return;

  // Reserve the slot immediately so we don't double-load on the next render.
  const anim = {idx: 0, T, timer: null, blobs: null};
  videoAnims[r.name] = anim;

  const url = i => `/sessions/${sid}/${r.name}/frames/frame_${String(i).padStart(4, '0')}.png`;
  let blobs;
  try {
    blobs = await Promise.all(
      Array.from({length: T}, (_, i) =>
        fetch(url(i)).then(res => res.blob()).then(b => URL.createObjectURL(b)))
    );
  } catch (_) {
    blobs = Array.from({length: T}, (_, i) => url(i));  // fallback: stream directly
  }
  // Session may have been switched while frames were loading.
  if (videoAnims[r.name] !== anim) {
    blobs.forEach(u => { if (u && u.startsWith('blob:')) URL.revokeObjectURL(u); });
    return;
  }
  anim.blobs = blobs;

  const img = tile.querySelector('img');
  img.src = blobs[0];
  tile.classList.add('ready');
  const period = Math.max(33, Math.round(dt * 1000));   // real-time, capped at 30fps
  anim.timer = setInterval(() => {
    anim.idx = (anim.idx + 1) % anim.T;
    img.src = anim.blobs[anim.idx];
  }, period);
}

// ── tab switching ─────────────────────────────────────────────────────────────
function switchTab(tab) {
  document.getElementById('tab-cfg').classList.toggle('active', tab === 'cfg');
  document.getElementById('tab-ses').classList.toggle('active', tab === 'ses');
  document.getElementById('tab-cmp').classList.toggle('active', tab === 'cmp');
  document.getElementById('pane-cfg').style.display = tab === 'cfg' ? '' : 'none';
  document.getElementById('pane-ses').style.display = tab === 'ses' ? 'flex' : 'none';
  document.getElementById('pane-cmp').style.display = tab === 'cmp' ? 'flex' : 'none';
  if (tab === 'ses' && currentView === 'aggregate') {
    setTimeout(resizeAggregateCharts, 50);
  }
  if (tab === 'cmp') {
    if (!queuesLoaded) loadQueues();
    setTimeout(resizeCompareChart, 50);
  }
}

// ── init ──────────────────────────────────────────────────────────────────────
async function init() {
  // Read hash first so tab switch is immediate — don't wait on data fetches.
  const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const sid = hash.get('sid');
  if (sid) switchTab('ses');

  await loadPolicies();
  await refreshSessionList();

  if (sid) {
    await loadSession(sid);
    startStream();
  } else if (knownSessions.length > 0) {
    await loadSession(knownSessions[0].session_id);
  }
}

// Handle back-link navigation from rollout pages in the same tab (no full reload).
window.addEventListener('hashchange', async () => {
  const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const sid = hash.get('sid');
  if (!sid) return;
  stopStream();
  rolloutData = {};
  resetSessionViews();
  switchTab('ses');
  await refreshSessionList();
  await loadSession(sid);
  startStream();
});

// ── configure tab ─────────────────────────────────────────────────────────────
function policyLabel(name) {
  // Show suffix if present (last dash-segment when it contains underscore)
  const parts = name.split('-');
  const suffix = parts[parts.length - 1];
  return suffix.includes('_') ? `${name.substring(0, name.lastIndexOf('-' + suffix))}  [${suffix}]` : name;
}

function selectPolicy(name) {
  document.getElementById('run-sel').value = name;
  document.getElementById('run-dd-toggle').textContent = name ? policyLabel(name) : '— select policy —';
  document.querySelectorAll('#run-dd-panel .dd-opt').forEach(o =>
    o.classList.toggle('sel', o.dataset.value === name));
  document.getElementById('run-dd').classList.remove('open');
  onRunChange();
}

function toggleRunDD(e) {
  e.stopPropagation();
  document.getElementById('run-dd').classList.toggle('open');
}
// Close the dropdown when clicking outside of it.
document.addEventListener('click', e => {
  const dd = document.getElementById('run-dd');
  if (dd && !dd.contains(e.target)) dd.classList.remove('open');
});

async function loadPolicies() {
  const policies = await fetch('/api/policies').then(r => r.json());
  const panel = document.getElementById('run-dd-panel');
  const byEnv = {};
  for (const p of policies) {
    if (!byEnv[p.env]) byEnv[p.env] = [];
    byEnv[p.env].push(p);
  }
  panel.innerHTML = '';
  document.getElementById('run-dd-toggle').textContent = '— select policy —';
  // Most recent run timestamp (YYYYMMDD-HHMMSS embedded in the name) per env.
  const ts = name => (name.match(/-(\d{8}-\d{6})/) || [, ''])[1];
  const recency = env => byEnv[env].reduce((mx, r) => { const t = ts(r.name); return t > mx ? t : mx; }, '');
  // Sort groups by which env ran most recently (newest first).
  const envs = Object.keys(byEnv).sort((a, b) => recency(b).localeCompare(recency(a)));
  envs.forEach((env) => {
    const grp = document.createElement('details');
    grp.className = 'dd-group';
    const sum = document.createElement('summary');
    sum.textContent = `${env}  (${byEnv[env].length})`;
    grp.appendChild(sum);
    for (const r of byEnv[env]) {
      const opt = document.createElement('div');
      opt.className = 'dd-opt';
      opt.dataset.value = r.name;
      opt.textContent = policyLabel(r.name);
      opt.onclick = () => selectPolicy(r.name);
      grp.appendChild(opt);
    }
    panel.appendChild(grp);
  });
}

async function onRunChange() {
  const run = document.getElementById('run-sel').value;
  if (!run) return;
  const steps = await fetch(`/api/checkpoints?run=${encodeURIComponent(run)}`).then(r => r.json());
  const sel = document.getElementById('ckpt-sel');
  sel.innerHTML = '<option value="latest">latest</option>';
  for (const s of [...steps].reverse()) {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = `step ${parseInt(s).toLocaleString()}`;
    sel.appendChild(opt);
  }
}

async function onRunClick() {
  const run = document.getElementById('run-sel').value;
  const ckpt = document.getElementById('ckpt-sel').value;
  const nDet = parseInt(document.getElementById('n-det').value) || 0;
  const nSto = parseInt(document.getElementById('n-sto').value) || 0;
  if (!run || nDet + nSto === 0) return;

  const btn = document.getElementById('run-btn');
  btn.disabled = true;
  btn.textContent = 'Starting…';

  try {
    const resp = await fetch('/api/sessions', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({run, checkpoint_step: ckpt || 'latest', n_det: nDet, n_sto: nSto}),
    });
    const {session_id} = await resp.json();
    rolloutData = {};
    window.location.hash = `sid=${session_id}`;
    await refreshSessionList();
    await loadSession(session_id);
    switchTab('ses');
    startStream();
  } finally {
    btn.disabled = false;
    btn.textContent = '▶ Run Analysis';
  }
}

// ── session management ────────────────────────────────────────────────────────
async function refreshSessionList() {
  knownSessions = await fetch('/api/sessions').then(r => r.json());
  const sel = document.getElementById('session-sel');
  sel.innerHTML = knownSessions.length === 0
    ? '<option value="">No sessions</option>'
    : knownSessions.map(s => {
        const label = s.run.split('-').pop() || s.session_id;
        const done = `${s.n_done}/${s.n_total}`;
        return `<option value="${s.session_id}">${label} (${done})</option>`;
      }).join('');
  if (currentSession) {
    sel.value = currentSession.session_id;
  }
}

async function onSessionChange() {
  const sid = document.getElementById('session-sel').value;
  if (!sid) return;
  stopStream();
  rolloutData = {};
  resetSessionViews();
  window.location.hash = `sid=${sid}`;
  await loadSession(sid);
  startStream();
}

async function onDeleteClick() {
  const sid = currentSession && currentSession.session_id;
  if (!sid) return;
  const label = knownSessions.find(s => s.session_id === sid)
    ? document.getElementById('session-sel').options[document.getElementById('session-sel').selectedIndex].text
    : sid;
  if (!confirm(`Delete session "${label}"?\n\nThis removes all rollout data on disk.`)) return;

  await fetch(`/api/sessions/${sid}`, {method: 'DELETE'});
  stopStream();
  currentSession = null;
  rolloutData = {};
  window.location.hash = '';
  resetSessionViews();
  document.getElementById('session-info').textContent = '';
  document.getElementById('rollout-list').innerHTML = '<div class="empty">No rollouts</div>';
  renderAggregatePlots();
  await refreshSessionList();
  if (knownSessions.length > 0) {
    await loadSession(knownSessions[0].session_id);
    startStream();
  }
}

// Reset the main-pane views when switching to a different session.
function resetSessionViews() {
  stopAllVideoAnims();
  document.getElementById('video-grid').innerHTML = '';
  document.getElementById('rollout-frame').removeAttribute('src');
  openRolloutName = null;
  document.getElementById('view-btn-rollout').style.display = 'none';
  document.getElementById('session-tags').innerHTML = '';
  showView('aggregate');
}

async function loadSession(sid) {
  const data = await fetch(`/api/sessions/${sid}?t=${Date.now()}`).then(r => r.json()).catch(() => null);
  if (!data) return;
  currentSession = data;

  document.getElementById('session-info').textContent =
    `${data.run.split('-').pop() || data.run}  ·  ${data.n_done}/${data.n_total} done`;
  document.getElementById('session-sel').value = sid;

  renderRolloutList(data);
  await fetchCompletedData();
  renderSessionTags(data);
  renderVideoGrid();        // before plots: must not be blocked if plotting throws
  renderAggregatePlots();
}

// ── live updates (Server-Sent Events) ───────────────────────────────────────────
// The server pushes a fresh session snapshot whenever its state changes, so there
// is no client poll loop to die, no cache to fight, and no fixed latency.
function startStream() {
  stopStream();
  if (!currentSession) return;
  const sid = currentSession.session_id;
  evtSource = new EventSource(`/api/sessions/${sid}/stream`);
  evtSource.onmessage = (e) => {
    let data;
    try { data = JSON.parse(e.data); } catch (_) { return; }
    applySessionUpdate(data);
  };
  // EventSource reconnects automatically on error; nothing to do here.
}

function stopStream() {
  if (evtSource) { evtSource.close(); evtSource = null; }
}

let _terminalRefreshed = false;
async function applySessionUpdate(data) {
  if (!data || !currentSession || data.session_id !== currentSession.session_id) return;
  if (data.deleted) { stopStream(); return; }

  currentSession = data;
  document.getElementById('session-info').textContent =
    `${data.run.split('-').pop() || data.run}  ·  ${data.n_done}/${data.n_total} done`;
  renderRolloutList(data);

  const prevDone = Object.keys(rolloutData).length;
  await fetchCompletedData();
  // Refresh the grid first (and unconditionally) so placeholder statuses update
  // live and previews start the moment a rollout finishes — and so a plotting
  // error can never prevent the videos from rendering.
  renderVideoGrid();
  if (Object.keys(rolloutData).length !== prevDone) {
    renderSessionTags(data);
    renderAggregatePlots();
  }

  // Refresh the session dropdown once, when everything is terminal.
  const nTerminal = data.rollouts.filter(
    r => r.status === 'done' || r.status === 'error'
  ).length;
  if (data.n_total > 0 && nTerminal === data.n_total) {
    if (!_terminalRefreshed) { _terminalRefreshed = true; refreshSessionList(); }
  } else {
    _terminalRefreshed = false;
  }
}

// ── rollout list ──────────────────────────────────────────────────────────────
function renderRolloutList(session) {
  const icons = {pending: '○', running: '●', done: '✓', error: '✗'};
  const sid = session.session_id;
  const list = document.getElementById('rollout-list');

  const nRunning = session.rollouts.filter(r => r.status === 'running').length;
  const nPending = session.rollouts.filter(r => r.status === 'pending').length;
  const nError   = session.rollouts.filter(r => r.status === 'error').length;
  let statusLine = '';
  if (nRunning > 0 || nPending > 0) {
    const parts = [];
    if (nRunning > 0) parts.push(`<span style="color:var(--yellow)">${nRunning} running</span>`);
    if (nPending > 0) parts.push(`<span>${nPending} queued</span>`);
    if (nError   > 0) parts.push(`<span style="color:var(--red)">${nError} failed</span>`);
    statusLine = `<div style="font-size:10px;color:var(--muted);padding:2px 6px 6px">${parts.join(' · ')}</div>`;
  } else if (nError > 0 && session.n_done === 0) {
    statusLine = `<div style="font-size:10px;color:var(--red);padding:2px 6px 6px">all ${nError} rollouts failed</div>`;
  }

  list.innerHTML = statusLine + session.rollouts.map(r => {
    const nameEl = r.status === 'done'
      ? `<a href="javascript:void(0)" onclick="openRollout('${r.name}')" class="rname">${r.name}</a>`
      : `<span class="rname">${r.name}</span>`;
    const tag = r.deterministic ? 'det' : 'sto';
    const detail = r.detail
      ? `<div class="rdetail">${r.detail}</div>`
      : (r.status === 'error' && r.error
          ? `<div class="rdetail" style="color:var(--red)">${r.error.slice(0, 80)}</div>`
          : '');
    return `<div class="ritem-wrap">
      <div class="ritem ${r.status}">
        <span>${icons[r.status] || '?'}</span>${nameEl}
        <span class="rtag">${tag}</span>
      </div>${detail}
    </div>`;
  }).join('') || '<div class="empty">No rollouts</div>';
}

// ── session-shared tags (sidebar) ───────────────────────────────────────────────
// These are identical across all rollouts in a session (env, checkpoint, …),
// so we show them once in the sidebar rather than per-rollout.
function renderSessionTags(session) {
  const el = document.getElementById('session-tags');
  if (!session) { el.innerHTML = ''; return; }

  const env = session.run.split(/-\d{8}-/)[0] || session.run;

  // Prefer values from a completed rollout's meta; fall back to session fields.
  const meta = Object.values(rolloutData).find(d => d && d.meta);
  let ckpt = session.checkpoint_step;
  if ((!ckpt || ckpt === 'latest') && meta) {
    ckpt = (meta.checkpoint || '').replace(/\\/g, '/').split('/').pop();
  }
  const ckptNum = parseInt(ckpt, 10);
  const ckptLabel = Number.isNaN(ckptNum) ? (ckpt || 'latest') : String(ckptNum);

  // sensor_bundle comes straight from the server (read from the run's config.json),
  // so it shows immediately — no need to wait for a rollout to finish.
  const sensor = session.sensor_bundle || (meta && meta.sensor_bundle);

  const rows = [['env', env]];
  if (sensor) rows.push(['sensor', sensor]);
  rows.push(['checkpoint', ckptLabel]);
  if (meta && meta.T != null)  rows.push(['steps', String(meta.T)]);
  if (meta && meta.dt != null) rows.push(['dt', meta.dt + ' s']);

  el.innerHTML = rows.map(([k, v]) =>
    `<div class="strow"><span class="stkey">${k}</span><span class="stval">${v}</span></div>`
  ).join('');
}

// ── data fetching ─────────────────────────────────────────────────────────────
async function fetchCompletedData() {
  if (!currentSession) return;
  const sid = currentSession.session_id;
  const toFetch = currentSession.rollouts.filter(
    r => r.status === 'done' && !rolloutData[r.name]
  );
  await Promise.all(toFetch.map(async r => {
    try {
      const d = await fetch(`/sessions/${sid}/${r.name}/data.json`).then(x => x.json());
      rolloutData[r.name] = d;
    } catch (_) {}
  }));
}

// ── aggregate plots ───────────────────────────────────────────────────────────
function computeBands(series) {
  const T = series[0].length;
  const n = series.length;
  const means = Array.from({length: T}, (_, t) =>
    series.reduce((sum, v) => sum + v[t], 0) / n
  );
  const stds = n > 1
    ? Array.from({length: T}, (_, t) => {
        const m = means[t];
        return Math.sqrt(series.reduce((s, v) => s + (v[t] - m) ** 2, 0) / n);
      })
    : Array(T).fill(0);
  return {
    means,
    upper: means.map((m, t) => m + stds[t]),
    lower: means.map((m, t) => m - stds[t]),
  };
}

function bandTraces(x, bands, label, color, showLegend = true) {
  return [
    {
      x: [...x, ...x.slice().reverse()],
      y: [...bands.upper, ...bands.lower.slice().reverse()],
      fill: 'toself', fillcolor: color + '30',
      line: {color: 'transparent'},
      type: 'scatter', mode: 'none',
      showlegend: false, hoverinfo: 'skip',
    },
    {
      x, y: bands.means,
      type: 'scatter', mode: 'lines',
      name: label, line: {color, width: 1.5},
      showlegend: showLegend,
    },
  ];
}

function renderAggregatePlots() {
  // Isolate plotting so an error (e.g. Plotly failing to load, or bad data)
  // can't abort the caller and take the video grid / live updates down with it.
  try {
    _renderAggregatePlots();
  } catch (err) {
    console.error('renderAggregatePlots failed:', err);
    const empty = document.getElementById('agg-empty');
    if (empty) {
      empty.style.display = '';
      empty.style.whiteSpace = 'pre';
      const plotlyMissing = (typeof Plotly === 'undefined');
      empty.textContent = plotlyMissing
        ? 'Plotly failed to load (CDN unreachable?).\nCharts are unavailable; videos still work.'
        : 'Plot error: ' + (err && err.message ? err.message : err);
    }
  }
}

function _renderAggregatePlots() {
  const datasets = Object.values(rolloutData);
  const n = datasets.length;
  const empty = document.getElementById('agg-empty');
  const statBar = document.getElementById('stat-bar');
  const rewardRow = document.getElementById('reward-row');
  const rewardTermsRow = document.getElementById('reward-terms-row');

  if (n === 0) {
    if (currentSession && currentSession.n_total > 0) {
      const nDone    = currentSession.n_done;
      const nTotal   = currentSession.n_total;
      const nRunning = currentSession.rollouts.filter(r => r.status === 'running').length;
      const nError   = currentSession.rollouts.filter(r => r.status === 'error').length;
      const nPending = currentSession.rollouts.filter(r => r.status === 'pending').length;
      const parts = [`${nDone}/${nTotal} complete`];
      if (nRunning > 0) parts.push(`${nRunning} running`);
      if (nPending > 0) parts.push(`${nPending} queued`);
      if (nError > 0)   parts.push(`${nError} failed`);
      let msg = parts.join('  ·  ');
      if (nRunning === 0 && nPending === nTotal) {
        msg += '\n\nLoading model and compiling… first rollout may take a minute.';
      } else if (nRunning === 0 && nPending > 0 && nDone === 0) {
        msg += '\n\nPrevious rollout finished, next one starting…';
      }
      empty.style.whiteSpace = 'pre';
      empty.textContent = msg;
    } else {
      empty.style.whiteSpace = '';
      empty.textContent = 'Start a session to see aggregate stats.';
    }
    empty.style.display = '';
    statBar.style.display = 'none';
    rewardRow.style.display = 'none';
    rewardTermsRow.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  statBar.style.display = 'flex';
  rewardRow.style.display = '';

  const T = datasets[0].meta.T;
  const dt = datasets[0].meta.dt;
  const tArr = Array.from({length: T}, (_, i) => +(i * dt).toFixed(4));

  // ── stat bar ──
  const totals = datasets.map(d => d.rewards.total.reduce((s, v) => s + v, 0));
  const meanTotal = totals.reduce((s, v) => s + v, 0) / n;
  const stdTotal = n > 1
    ? Math.sqrt(totals.reduce((s, v) => s + (v - meanTotal) ** 2, 0) / n)
    : 0;

  // Success: look for a 'success' key in reward term_keys
  let successHtml = '';
  const tkArr = datasets[0].rewards.term_keys;
  const successIdx = tkArr.findIndex(k => k.includes('success'));
  if (successIdx >= 0 && datasets[0].dof) {
    // success is not stored per-term in data.json right now, skip
  }

  statBar.innerHTML = `
    <div class="stat-item">
      <span class="stat-label">rollouts</span>
      <span class="stat-val">${n}</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">episode reward (mean)</span>
      <span class="stat-val">${meanTotal.toFixed(2)}</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">episode reward (std)</span>
      <span class="stat-val">${stdTotal.toFixed(2)}</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">episode reward (min / max)</span>
      <span class="stat-val">${Math.min(...totals).toFixed(2)} / ${Math.max(...totals).toFixed(2)}</span>
    </div>
  `;

  // ── reward over time ──
  const rewardSeries = datasets.map(d => d.rewards.total);
  const rewardBands = computeBands(rewardSeries);
  Plotly.react(
    'reward-chart',
    bandTraces(tArr, rewardBands, 'reward', COLORS[0], false),
    {...basePlotLayout(`Total Reward per step  (n=${n})`), showlegend: false},
    plotCfg,
  );

  // ── per-reward-term distribution across rollouts (mean ± std band per term) ──
  // Same visual style as the pre-squash distribution plots: one shaded band +
  // mean line per series, here one series per reward term.
  const termKeys = datasets[0].rewards.term_keys || [];
  const haveTerms = datasets.every(d => d.rewards && Array.isArray(d.rewards.terms))
    && termKeys.length > 0;
  if (haveTerms) {
    rewardTermsRow.style.display = '';
    const termTraces = termKeys.flatMap((key, k) => {
      const series = datasets.map(d => d.rewards.terms.map(row => row[k]));
      const label = key.startsWith('reward/') ? key.slice(7) : key;
      return bandTraces(tArr, computeBands(series), label, COLORS[k % COLORS.length]);
    });
    Plotly.react(
      'reward-terms-chart',
      termTraces,
      basePlotLayout(`Reward terms per step  (mean ± std, n=${n})`),
      plotCfg,
    );
    // Toggling a term's line in the legend should also hide/show its band.
    // Traces are laid out [band, line] per term, so the band for the clicked
    // line (curveNumber 2k+1) is the trace right before it (2k).
    const rtDiv = document.getElementById('reward-terms-chart');
    if (!rtDiv._bandToggleWired) {
      rtDiv._bandToggleWired = true;
      rtDiv.on('plotly_legendclick', (ev) => {
        const band = ev.curveNumber - 1;
        if (band < 0) return true;
        const lineVisible = rtDiv.data[ev.curveNumber].visible !== 'legendonly';
        Plotly.restyle(rtDiv, {visible: lineVisible ? 'legendonly' : true}, [band]);
        return true;  // keep Plotly's default toggle on the clicked line
      });
    }
  } else {
    rewardTermsRow.style.display = 'none';
  }

  // Charts may have been (re)created while the view was hidden; ensure they size.
  if (currentView === 'aggregate') setTimeout(resizeAggregateCharts, 0);
}

// ── compare tab ─────────────────────────────────────────────────────────────────
let queuesLoaded = false;
let queueData = [];                 // [{queue, policies:[...]}]
let queueSearch = '';               // lowercased filter over queue / policy names
const openQueues = new Set();       // queue names whose policy list is expanded
// Pinned queue names, persisted across sessions; rendered in their own section.
const pinnedQueues = new Set(JSON.parse(localStorage.getItem('cmpPinnedQueues') || '[]'));
const openCards = new Set();        // policy keys whose seed list is expanded
const deselectedSeeds = new Set();  // run_names excluded from their policy (default: all in)
const selectedPolicies = new Map(); // key -> {label, sensor_bundle, env_name, run_names[]}
let cmpEnv = null;                  // env_name shared by current selection
let appliedConfigEnv = null;        // env whose defaults are currently in the form
const cmpConfigCache = {};          // env_name -> /api/compare/config result
const cmpBenchmarkCache = {};       // env_name -> /api/compare/benchmarks result
let comparePollTimer = null;

function resizeCompareChart() {
  const el = document.getElementById('cmp-chart');
  if (el && el.data) { try { Plotly.Plots.resize(el); } catch (_) {} }
}

async function loadQueues(force) {
  if (queuesLoaded && !force) return;
  queuesLoaded = true;
  const list = document.getElementById('queue-list');
  list.innerHTML = '<div class="empty">Loading…</div>';
  try {
    queueData = await fetch('/api/queues').then(r => r.json());
  } catch (_) {
    list.innerHTML = '<div class="empty">Failed to load queues.</div>';
    return;
  }
  if (queueData.length) openQueues.add(queueData[0].queue);  // newest open by default
  renderQueues();
}

function onQueueSearch(v) {
  queueSearch = v.trim().toLowerCase();
  renderQueues();
}

function togglePinQueue(name) {
  if (pinnedQueues.has(name)) pinnedQueues.delete(name); else pinnedQueues.add(name);
  localStorage.setItem('cmpPinnedQueues', JSON.stringify([...pinnedQueues]));
  renderQueues();
}

function queueMatchesSearch(q) {
  if (!queueSearch) return true;
  return q.queue.toLowerCase().includes(queueSearch)
    || q.policies.some(p => (p.label || '').toLowerCase().includes(queueSearch));
}

function qsectionLabel(text) {
  const d = document.createElement('div');
  d.className = 'qsection';
  d.textContent = text;
  return d;
}

function queueGroup(q) {
  const g = document.createElement('div');
  g.className = 'qgroup' + (openQueues.has(q.queue) ? ' open' : '');
  const head = document.createElement('div');
  head.className = 'qhead';
  head.onclick = () => {
    const on = g.classList.toggle('open');
    if (on) openQueues.add(q.queue); else openQueues.delete(q.queue);
  };
  const pinned = pinnedQueues.has(q.queue);
  head.innerHTML =
    `<span class="qtwist">▸</span>` +
    `<span class="qname">${q.queue}</span>` +
    `<span class="qcount">${q.policies.length}</span>` +
    `<span class="qpin${pinned ? ' on' : ''}" title="${pinned ? 'Unpin' : 'Pin'}">${pinned ? '★' : '☆'}</span>`;
  head.querySelector('.qpin').onclick = (e) => { e.stopPropagation(); togglePinQueue(q.queue); };
  g.appendChild(head);

  const pols = document.createElement('div');
  pols.className = 'qpolicies';
  q.policies.forEach(p => pols.appendChild(policyCard(q.queue, p)));
  g.appendChild(pols);
  return g;
}

function renderQueues() {
  const list = document.getElementById('queue-list');
  if (!queueData.length) { list.innerHTML = '<div class="empty">No queues found.</div>'; return; }

  const visible = queueData.filter(queueMatchesSearch);
  list.innerHTML = '';
  if (!visible.length) { list.innerHTML = '<div class="empty">No matching queues.</div>'; return; }

  const pinned = visible.filter(q => pinnedQueues.has(q.queue));
  const rest = visible.filter(q => !pinnedQueues.has(q.queue));

  if (pinned.length) {
    list.appendChild(qsectionLabel('Pinned'));
    pinned.forEach(q => list.appendChild(queueGroup(q)));
    if (rest.length) list.appendChild(qsectionLabel('Recent'));
  }
  rest.forEach(q => list.appendChild(queueGroup(q)));
}

function policyKey(queue, p) { return queue + '::' + p.id; }

function policyCard(queue, p) {
  const key = policyKey(queue, p);
  const runnable = p.seeds.filter(s => s.runnable);
  const disabled = runnable.length === 0;

  const card = document.createElement('div');
  card.className = 'pcard';
  if (p.n_seeds > 1) card.classList.add('stacked');
  if (p.n_seeds > 2) card.classList.add('deep');
  if (selectedPolicies.has(key)) card.classList.add('selected');
  if (openCards.has(key)) card.classList.add('open');

  const used = policyRunNames(p).length;
  const head = document.createElement('div');
  head.className = 'pcard-head';
  const bundle = p.sensor_bundle ? `<span class="pcard-bundle">${p.sensor_bundle}</span>` : '';
  head.innerHTML =
    `<input type="checkbox" ${selectedPolicies.has(key) ? 'checked' : ''} ${disabled ? 'disabled' : ''}>` +
    `<span class="pcard-label">${p.label} ${bundle}</span>` +
    `<span class="pcard-badge">×${p.n_seeds}` +
      `${p.runnable_seeds < p.n_seeds ? ' (' + p.runnable_seeds + ' ok)' : ''}` +
      `${used < runnable.length ? ' · ' + used + ' used' : ''}</span>` +
    `<span class="pcard-twist">▸</span>`;
  // Checkbox toggles selection; clicking elsewhere on the head expands the stack.
  const cb = head.querySelector('input');
  cb.onclick = (e) => { e.stopPropagation(); togglePolicySelect(key, queue, p, cb.checked); };
  head.onclick = () => {
    const on = card.classList.toggle('open');
    if (on) openCards.add(key); else openCards.delete(key);
  };
  card.appendChild(head);

  const seeds = document.createElement('div');
  seeds.className = 'pcard-seeds';
  p.seeds.forEach(s => {
    const cls = s.result === 'ok' ? 'ok' : 'failed';
    const included = s.runnable && !deselectedSeeds.has(s.run_name);
    const open = s.runnable
      ? `<a class="sopen" onclick="openRunAnalysis('${s.run_name}')">open ▸</a>`
      : `<span class="sopen">${s.result}</span>`;
    const row = document.createElement('div');
    row.className = `seedrow ${cls}`;
    row.innerHTML =
      `<input type="checkbox" class="seedcb" ${included ? 'checked' : ''} ${s.runnable ? '' : 'disabled'}>` +
      `<span class="sdot">●</span>` +
      `<span class="sname">seed ${s.seed == null ? '?' : s.seed} · ${s.run_name}</span>` +
      open;
    if (s.runnable) {
      const scb = row.querySelector('.seedcb');
      scb.onclick = (e) => { e.stopPropagation(); toggleSeed(key, queue, p, s.run_name, scb.checked); };
    }
    seeds.appendChild(row);
  });
  card.appendChild(seeds);
  return card;
}

// Runnable seeds a policy contributes — all by default, minus any deselected.
function policyRunNames(p) {
  return p.seeds
    .filter(s => s.runnable && !deselectedSeeds.has(s.run_name))
    .map(s => s.run_name);
}

function togglePolicySelect(key, queue, p, on) {
  if (!on) {
    selectedPolicies.delete(key);
  } else {
    // Selection must share one env (the success criterion is per-env).
    if (cmpEnv && p.env_name !== cmpEnv && selectedPolicies.size) {
      selectedPolicies.clear();
    }
    cmpEnv = p.env_name;
    selectedPolicies.set(key, {
      label: p.label,
      sensor_bundle: p.sensor_bundle,
      env_name: p.env_name,
      run_names: policyRunNames(p),
    });
  }
  if (!selectedPolicies.size) cmpEnv = null;
  renderQueues();               // reflect selection / env reset across cards
  if (cmpEnv) loadCompareConfig(cmpEnv);
  updateGenEnabled();
}

// Include/exclude one seed. If the policy is selected, keep its run_names in
// sync; deselecting the last included seed deselects the whole policy.
function toggleSeed(key, queue, p, run_name, on) {
  if (on) deselectedSeeds.delete(run_name); else deselectedSeeds.add(run_name);
  if (selectedPolicies.has(key)) {
    const run_names = policyRunNames(p);
    if (!run_names.length) { togglePolicySelect(key, queue, p, false); return; }
    selectedPolicies.get(key).run_names = run_names;
  }
  renderQueues();
  updateGenEnabled();
}

function updateGenEnabled() {
  const btn = document.getElementById('cmp-gen');
  const ch = document.getElementById('cmp-channel').value;
  btn.disabled = selectedPolicies.size === 0 || !ch || comparePollTimer != null;
  const st = document.getElementById('cmp-status');
  if (!comparePollTimer) {
    st.className = '';
    st.textContent = selectedPolicies.size
      ? `${selectedPolicies.size} polic${selectedPolicies.size === 1 ? 'y' : 'ies'} selected${cmpEnv ? ' · ' + cmpEnv : ''}`
      : 'Select policies from one queue to compare.';
  }
}

async function loadCompareConfig(env) {
  // Applying the per-env defaults overwrites the form (criterion, sweep bounds,
  // …). Do it only when the env actually changes, so selecting/deselecting
  // seeds within one env keeps the user's current edits.
  if (env === appliedConfigEnv) return;
  let cfg = cmpConfigCache[env];
  if (!cfg) {
    cfg = await fetch(`/api/compare/config?env=${encodeURIComponent(env)}`).then(r => r.json());
    cmpConfigCache[env] = cfg;
  }
  applyCompareConfig(cfg);
  await loadBenchmarks(env);
  appliedConfigEnv = env;
}

async function loadBenchmarks(env) {
  let list = cmpBenchmarkCache[env];
  if (!list) {
    try {
      list = await fetch(`/api/compare/benchmarks?env=${encodeURIComponent(env)}`).then(r => r.json());
    } catch { list = []; }
    if (!list || !list.length) list = [{name: 'default', label: 'Default (training config)'}];
    cmpBenchmarkCache[env] = list;
  }
  const sel = document.getElementById('cmp-benchmark');
  const prev = sel.value;
  sel.innerHTML = list
    .map(b => `<option value="${b.name}" title="${(b.description || '').replace(/"/g, '&quot;')}">${b.label}</option>`)
    .join('');
  sel.value = list.some(b => b.name === prev) ? prev : (list[0] ? list[0].name : 'default');
}

function applyCompareConfig(cfg) {
  const chSel = document.getElementById('cmp-channel');
  const channels = cfg.available_channels && cfg.available_channels.length
    ? cfg.available_channels
    : (cfg.channel ? [cfg.channel] : []);
  const prev = chSel.value;
  chSel.innerHTML = channels.length
    ? channels.map(c => `<option value="${c}">${c}</option>`).join('')
    : '<option value="">(run once to discover channels)</option>';
  // Keep the user's pick if still valid, else use the config default.
  chSel.value = channels.includes(prev) ? prev
    : (channels.includes(cfg.channel) ? cfg.channel : (channels[0] || ''));
  document.getElementById('cmp-abs').checked = !!cfg.abs;
  document.getElementById('cmp-smin').value = cfg.sweep_min;
  document.getElementById('cmp-smax').value = cfg.sweep_max;
  document.getElementById('cmp-npts').value = cfg.n_points;
  document.getElementById('cmp-hold').value = cfg.hold_steps;
  document.getElementById('cmp-skip').value = cfg.skip_first != null ? cfg.skip_first : 0;
  document.getElementById('cmp-smode').value = cfg.success_mode || 'hold';
  onSuccessModeChange();   // show the field that matches the criterion
  // Stash non-edited config (units/labels/ref) for the POST + plot.
  document.getElementById('cmp-controls').dataset.cfg = JSON.stringify(cfg);
  updateGenEnabled();
}

// Show only the parameter relevant to the chosen success criterion: hold-steps
// for the sequential-hold mode, skip-first for either rollout-average mode.
function onSuccessModeChange() {
  const avg = document.getElementById('cmp-smode').value.startsWith('average');
  document.getElementById('cmp-hold-field').style.display = avg ? 'none' : '';
  document.getElementById('cmp-skip-field').style.display = avg ? '' : 'none';
}

async function openRunAnalysis(run_name) {
  // Reuse the existing session flow to inspect one training run's details.
  const resp = await fetch('/api/sessions', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({run: run_name, checkpoint_step: 'latest', n_det: 3, n_sto: 3}),
  });
  const {session_id} = await resp.json();
  rolloutData = {};
  window.location.hash = `sid=${session_id}`;
  await refreshSessionList();
  await loadSession(session_id);
  switchTab('ses');
  startStream();
}

function buildCriterion() {
  const base = JSON.parse(document.getElementById('cmp-controls').dataset.cfg || '{}');
  return {
    ...base,
    channel: document.getElementById('cmp-channel').value,
    abs: document.getElementById('cmp-abs').checked,
    sweep_min: parseFloat(document.getElementById('cmp-smin').value),
    sweep_max: parseFloat(document.getElementById('cmp-smax').value),
    n_points: parseInt(document.getElementById('cmp-npts').value) || 151,
    success_mode: document.getElementById('cmp-smode').value,
    hold_steps: parseInt(document.getElementById('cmp-hold').value) || 10,
    skip_first: parseFloat(document.getElementById('cmp-skip').value) || 0,
  };
}

async function onGenerateCompare() {
  if (!selectedPolicies.size) return;
  const mode = document.getElementById('cmp-mode').value;
  const benchmark = document.getElementById('cmp-benchmark').value || 'default';
  const n_rollouts = parseInt(document.getElementById('cmp-nroll').value) || 50;
  const criterion = buildCriterion();
  if (!criterion.channel) return;

  const policies = [...selectedPolicies.values()].map(p => ({
    label: p.label, sensor_bundle: p.sensor_bundle, run_names: p.run_names,
  }));

  const resp = await fetch('/api/compare', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({mode, benchmark, n_rollouts, criterion, policies}),
  });
  const {compare_id} = await resp.json();
  pollCompare(compare_id);
}

function pollCompare(cid) {
  if (comparePollTimer) clearInterval(comparePollTimer);
  const st = document.getElementById('cmp-status');
  updateGenEnabled();   // disables Generate while running
  const tick = async () => {
    let data;
    try { data = await fetch(`/api/compare/${cid}?t=${Date.now()}`).then(r => r.json()); }
    catch (_) { return; }
    if (data.status === 'ready') {
      clearInterval(comparePollTimer); comparePollTimer = null;
      st.className = ''; st.textContent = 'Done.';
      renderCompareChart(data.result);
      updateGenEnabled();
      return;
    }
    const runs = data.runs || [];
    const running = runs.filter(r => r.status === 'running').length;
    const ready = runs.filter(r => r.status === 'ready').length;
    const errored = runs.filter(r => r.status === 'error');
    st.className = errored.length ? 'err' : '';
    let msg = `Collecting rollouts — ${ready}/${runs.length} cached, ${running} running…`;
    if (errored.length) msg += `  ·  ${errored.length} failed: ${errored[0].error ? errored[0].error.slice(0, 80) : ''}`;
    st.textContent = msg;
  };
  comparePollTimer = setInterval(tick, 1500);
  tick();
}

const CMP_COLORS = COLORS;

// The most recent renderCompareChart() result, kept so the download buttons can
// re-export the underlying data without recomputing.
let lastCompareResult = null;

function cmpDownloadName() {
  const ch = (document.getElementById('cmp-channel').value || 'success').replace(/[^\w.-]+/g, '_');
  return `compare_${ch}`;
}

// Export the rendered Compare chart as a PNG. The modebar is hidden (plotCfg),
// so this is the only way to download; filename follows the success channel.
function downloadCompareChart() {
  const gd = document.getElementById('cmp-chart');
  if (!gd || !gd.data || !gd.data.length) return;
  Plotly.downloadImage(gd, {
    format: 'png', scale: 2,
    width: gd.clientWidth, height: gd.clientHeight,
    filename: cmpDownloadName(),
  });
}

function csvCell(v) {
  const s = String(v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

// Export the underlying curve data (x + each policy's mean/min/max) as CSV, for
// replotting elsewhere. One row per swept threshold; min/max equal mean for
// single-seed policies (no band).
function downloadCompareData() {
  const result = lastCompareResult;
  if (!result || !result.x || !result.x.length) return;
  const x = result.x;
  const header = [result.xlabel || 'threshold'];
  const columns = [x];
  result.policies.forEach(p => {
    header.push(`${p.label} mean`, `${p.label} min`, `${p.label} max`);
    columns.push(p.mean, p.min, p.max);
  });
  const rows = [header.map(csvCell).join(',')];
  for (let r = 0; r < x.length; r++) {
    rows.push(columns.map(col => csvCell(col[r])).join(','));
  }
  const blob = new Blob([rows.join('\n') + '\n'], {type: 'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${cmpDownloadName()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function renderCompareChart(result) {
  lastCompareResult = result;
  const x = result.x;
  // X-axis spans the actual swept range so changing sweep_min/sweep_max and
  // regenerating rescales the axis with the data, rather than leaving it pinned
  // to a fixed per-channel default that just clips the lines.
  const xmin = x.length ? x[0] : undefined;
  const xmax = x.length ? x[x.length - 1] : undefined;
  const traces = [];
  const bandForLine = {};   // line trace index -> its band trace index (if any)
  result.policies.forEach((p, i) => {
    const color = CMP_COLORS[i % CMP_COLORS.length];
    // min-max band (skip when a single seed has no spread)
    let bandIdx = null;
    if (p.n_seeds > 1) {
      bandIdx = traces.length;
      traces.push({
        x: [...x, ...x.slice().reverse()],
        y: [...p.max, ...p.min.slice().reverse()],
        fill: 'toself', fillcolor: color + '25', line: {color: 'transparent'},
        type: 'scatter', mode: 'none', showlegend: false, hoverinfo: 'skip',
      });
    }
    if (bandIdx != null) bandForLine[traces.length] = bandIdx;
    traces.push({
      x, y: p.mean, type: 'scatter', mode: 'lines',
      name: `${p.label} (n=${p.n_seeds} seed${p.n_seeds === 1 ? '' : 's'})`,
      line: {color, width: 2},
    });
  });

  const shapes = [], annotations = [];
  if (result.ref) {
    shapes.push({
      type: 'line', x0: result.ref.value, x1: result.ref.value, y0: 0, y1: 100,
      line: {color: '#9ca3af', dash: 'dash', width: 1},
    });
    if (result.ref.label) annotations.push({
      x: result.ref.value, y: 100, yanchor: 'bottom', text: result.ref.label,
      showarrow: false, font: {size: 9, color: '#9ca3af'},
    });
  }

  const skipNote = `skip first ${result.skip_first ?? 0}s (${result.skip_steps ?? 0} steps)`;
  const critNote =
    result.success_mode === 'average' ? `avg error below thr · ${skipNote}`
    : result.success_mode === 'average_above' ? `mean metric above thr · ${skipNote}`
    : `hold ${result.hold_steps} steps`;
  const layout = {
    ...basePlotLayout(`Success rate vs threshold · ${critNote}`),
    showlegend: true,
    margin: {l: 50, r: 10, t: 28, b: 44},
    xaxis: {
      title: {text: result.xlabel, font: {size: 11}}, gridcolor: '#374151',
      range: xmin != null ? [xmin, xmax] : undefined,
    },
    yaxis: {title: {text: result.ylabel, font: {size: 11}}, gridcolor: '#374151', range: [0, 100]},
    legend: {font: {size: 10}},
    shapes, annotations,
  };
  Plotly.react('cmp-chart', traces, layout, plotCfg);
  document.getElementById('cmp-dl').disabled = false;        // PNG now downloadable
  document.getElementById('cmp-dl-data').disabled = false;   // CSV now downloadable
  // Toggling a policy's line in the legend should also hide/show its min-max
  // band. Pairing is irregular (band only when n_seeds > 1), so look it up.
  const cmpDiv = document.getElementById('cmp-chart');
  cmpDiv._bandForLine = bandForLine;
  if (!cmpDiv._bandToggleWired) {
    cmpDiv._bandToggleWired = true;
    cmpDiv.on('plotly_legendclick', (ev) => {
      const band = cmpDiv._bandForLine[ev.curveNumber];
      if (band == null) return true;
      const lineVisible = cmpDiv.data[ev.curveNumber].visible !== 'legendonly';
      Plotly.restyle(cmpDiv, {visible: lineVisible ? 'legendonly' : true}, [band]);
      return true;  // keep Plotly's default toggle on the clicked line
    });
  }
  setTimeout(resizeCompareChart, 0);
}

// ── start ─────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
