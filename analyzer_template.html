  list.innerHTML = binCands.map(c => {
    if (!(c.name in binSel)) binSel[c.name] = {checked: true, points: c.default_points};
    const s = binSel[c.name];
    const hint = `[${(+c.lo).toPrecision(3)}, ${(+c.hi).toPrecision(3)}]`;
    return `<label class="grid-axis-row">
      <input type="checkbox" ${s.checked ? 'checked' : ''}
             onchange="onBinAxisToggle('${c.name}', this.checked)">
      <span>${c.label}</span>
      <span class="grid-axis-hint">${hint}</span>
      <input type="number" min="2" max="64" value="${s.points}"
             onchange="onBinAxisPoints('${c.name}', this.value)" title="bins on this axis">
    </label>`;
  }).join('');
  updateBinCells();
}
function onBinAxisToggle(name, on) {
  if (binSel[name]) binSel[name].checked = on;
  updateBinCells();
  if (currentDataset && lastCompareResult) viewScore();
}
function onBinAxisPoints(name, v) {
  if (binSel[name]) binSel[name].points = Math.max(2, parseInt(v) || 8);
  updateBinCells();
  if (currentDataset && lastCompareResult) viewScore();
}
function selectedBinAxes() {
  return binCands
    .filter(c => c.channel && binSel[c.name] && binSel[c.name].checked)
    .map(c => ({
      name: c.name, label: c.label, channel: c.channel,
      channel_scale: c.channel_scale != null ? c.channel_scale : 1.0,
      values: genAxisCenters(c, binSel[c.name].points),
    }));
}
function updateBinCells() {
  const el = document.getElementById('viz-bin-cells');
  const sel = binCands.filter(c => binSel[c.name] && binSel[c.name].checked);
  const cells = sel.reduce((a, c) => a * Math.max(1, binSel[c.name].points), 1);
  el.textContent = sel.length ? `${cells} bins` : 'no bin axes selected';
  el.className = 'grid-cells' + (sel.length ? '' : ' err');
}

function applyCompareConfig(cfg) {
  const chSel = document.getElementById('cmp-channel');
  const channels = cfg.available_channels && cfg.available_channels.length
    ? cfg.available_channels
    : (cfg.channel ? [cfg.channel] : []);
  const prev = chSel.value;
  chSel.innerHTML = channels.length
    ? channels.map(c => `<option value="${c}">${c}</option>`).join('')
    : '<option value="">(run once to discover channels)</option>';
  // Keep the user's pick if still valid, else use the config default.
  chSel.value = channels.includes(prev) ? prev
    : (channels.includes(cfg.channel) ? cfg.channel : (channels[0] || ''));
  document.getElementById('cmp-abs').checked = !!cfg.abs;
  document.getElementById('cmp-smin').value = cfg.sweep_min;
  document.getElementById('cmp-smax').value = cfg.sweep_max;
  document.getElementById('cmp-npts').value = cfg.n_points;
  document.getElementById('cmp-hold').value = cfg.hold_steps;
  document.getElementById('cmp-skip').value = cfg.skip_first != null ? cfg.skip_first : 0;
  document.getElementById('cmp-smode').value = cfg.success_mode || 'hold';
  onSuccessModeChange();   // show the field that matches the criterion
  // Grid's single Threshold: default to the env's reference value, else the
  // sweep midpoint (the same value compute_grid_heatmap would fall back to).
  document.getElementById('cmp-threshold').value = cfg.ref_value != null
    ? cfg.ref_value
    : 0.5 * ((parseFloat(cfg.sweep_min) || 0) + (parseFloat(cfg.sweep_max) || 0));
  // Stash non-edited config (units/labels/ref) for the POST + plot.
  document.getElementById('cmp-controls').dataset.cfg = JSON.stringify(cfg);
}

// Show only the parameter relevant to the chosen success criterion: hold-steps
// for the sequential-hold mode, skip-first for either rollout-average mode.
function onSuccessModeChange() {
  const avg = document.getElementById('cmp-smode').value.startsWith('average');
  document.getElementById('cmp-hold-field').style.display = avg ? 'none' : '';
  document.getElementById('cmp-skip-field').style.display = avg ? '' : 'none';
}

async function openRunAnalysis(run_name) {
  // Reuse the existing session flow to inspect one training run's details.
  const resp = await fetch('/api/sessions', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({run: run_name, checkpoint_step: 'latest', n_det: 3, n_sto: 3}),
  });
  const {session_id} = await resp.json();
  rolloutData = {};
  window.location.hash = `sid=${session_id}`;
  await refreshSessionList();
  await loadSession(session_id);
  switchTab('ses');
  startStream();
}

function buildCriterion() {
  const base = JSON.parse(document.getElementById('cmp-controls').dataset.cfg || '{}');
  const thrRaw = document.getElementById('cmp-threshold').value;
  const crit = {
    ...base,
    channel: document.getElementById('cmp-channel').value,
    abs: document.getElementById('cmp-abs').checked,
    // Heatmap's single judging threshold; null lets the server fall back to
    // ref_value / midpoint. Ignored by the curve path (it sweeps instead).
    threshold: thrRaw === '' ? null : parseFloat(thrRaw),
    sweep_min: parseFloat(document.getElementById('cmp-smin').value),
    sweep_max: parseFloat(document.getElementById('cmp-smax').value),
    n_points: parseInt(document.getElementById('cmp-npts').value) || 151,
    success_mode: document.getElementById('cmp-smode').value,
    hold_steps: parseInt(document.getElementById('cmp-hold').value) || 10,
    skip_first: parseFloat(document.getElementById('cmp-skip').value) || 0,
  };
  // Sampled heatmap: how to bin the pool. Grid heatmaps ignore this (they use
  // the cache's pinned cell_values); curves ignore it entirely.
  if (isHeatmap() && !datasetIsGrid()) crit.heatmap_axes = selectedBinAxes();
  return crit;
}

// Any scoring / visualization / bin-axis change re-renders the selected dataset
// from cache (no GPU, no re-collect) — the whole point of saved datasets.
function onScoringChange() {
  if (currentDataset) viewScore();
}

async function viewScore() {
  if (!currentDataset) return;
  const criterion = buildCriterion();
  const st = document.getElementById('cmp-status');
  if (!criterion.channel) { st.className = ''; st.textContent = 'Pick a success channel.'; return; }
  st.className = ''; st.textContent = 'Rendering…';
  try {
    const data = await fetch('/api/compare/view', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        mode: currentDataset.mode, benchmark: currentDataset.benchmark,
        visualization: document.getElementById('cmp-viz').value,
        criterion, policies: currentDataset.policies, grid_spec: currentDataset.grid_spec,
      }),
    }).then(r => r.json());
    if (data && data.result) {
      st.className = ''; st.textContent = 'Done.';
      renderCompareChart(data.result);
    } else {
      st.className = 'err';
      if (data && data.error === 'not collected') {
        const d = datasets.find(x => x.slug === currentDataset.slug);
        st.textContent = d && d.seeds_total
          ? `Dataset still collecting — ${d.seeds_done}/${d.seeds_total} seeds done; renders automatically when complete.`
          : 'Dataset still collecting — renders automatically when complete.';
      } else {
        st.textContent = 'Re-view failed.';
      }
    }
  } catch (_) {
    st.className = 'err'; st.textContent = 'Re-view failed.';
  }
}

// ── dataset sidebar ──────────────────────────────────────────────────────────
async function loadDatasets() {
  datasetsLoaded = true;
  const wasCollecting = new Set(
    datasets.filter(d => d.status === 'collecting').map(d => d.slug));
  try { datasets = await fetch('/api/datasets').then(r => r.json()); } catch (_) { datasets = []; }
  if (!Array.isArray(datasets)) datasets = [];
  renderDatasetList();
  // A dataset that just finished while selected: render it without a click.
  if (currentDataset && wasCollecting.has(currentDataset.slug)
      && datasets.some(d => d.slug === currentDataset.slug && d.status === 'ready')) {
    viewScore();
  }
  ensureDatasetPolling();
}

// Refresh the sidebar while anything is collecting, so seed counts stay live
// even with the collect modal closed or after a page reload mid-collection.
let datasetPollTimer = null;
function ensureDatasetPolling() {
  const collecting = datasets.some(d => d.status === 'collecting');
  if (collecting && !datasetPollTimer) {
    datasetPollTimer = setInterval(loadDatasets, 3000);
  } else if (!collecting && datasetPollTimer) {
    clearInterval(datasetPollTimer); datasetPollTimer = null;
  }
}

// "collecting 3/6" while running, plain status otherwise.
function datasetStatusText(d) {
  return d.status === 'collecting' && d.seeds_total
    ? `collecting ${d.seeds_done}/${d.seeds_total} seeds`
    : d.status;
}

function renderDatasetList() {
  const el = document.getElementById('dataset-list');
  if (!datasets.length) {
    el.innerHTML = '<div class="empty">No datasets yet — click ＋ Collect new dataset.</div>';
    return;
  }
  el.innerHTML = datasets.map(d => `
    <div class="dataset-item ${currentDataset && currentDataset.slug === d.slug ? 'sel' : ''}"
         onclick="selectDataset('${d.slug}')">
      <span class="ds-dot ${d.status}" title="${datasetStatusText(d)}"></span>
      <div class="ds-body">
        <div class="ds-name" title="${d.name}">${d.name}</div>
        <div class="ds-meta">${d.benchmark} · ${d.n_policies} polic${d.n_policies === 1 ? 'y' : 'ies'} · ${datasetStatusText(d)}</div>
      </div>
      <button class="ds-del" title="Delete dataset"
              onclick="event.stopPropagation(); onDeleteDataset('${d.slug}')">🗑</button>
    </div>`).join('');
}

async function selectDataset(slug) {
  let meta;
  try { meta = await fetch(`/api/datasets/${encodeURIComponent(slug)}`).then(r => r.json()); }
  catch (_) { return; }
  if (!meta || !meta.slug) return;
  currentDataset = meta;
  renderDatasetList();
  await loadVizConfig(meta.env);   // channel / criterion defaults for this env
  syncVizFields();
  await refreshBinAxes();
  viewScore();
}

async function onDeleteDataset(slug) {
  try { await fetch(`/api/datasets/${encodeURIComponent(slug)}`, {method: 'DELETE'}); } catch (_) {}
  if (currentDataset && currentDataset.slug === slug) {
    currentDataset = null;
    Plotly.purge('cmp-chart');
    document.getElementById('cmp-grid-controls').style.display = 'none';
    document.getElementById('viz-bin-axes').style.display = 'none';
    const st = document.getElementById('cmp-status'); st.className = ''; st.textContent = 'Select a dataset to visualize.';
  }
  await loadDatasets();
}

// ── collect modal ────────────────────────────────────────────────────────────
function openCollectModal() {
  openModal('modal-collect');
  if (!queuesLoaded) loadQueues();
  updateColCollectEnabled();
}

async function onCollectDataset() {
  const name = document.getElementById('col-name').value.trim();
  if (!name || !selectedPolicies.size) return;
  const benchmark = document.getElementById('col-benchmark').value || 'default';
  const mode = document.getElementById('col-mode').value;
  const policies = [...selectedPolicies.values()].map(p => ({
    label: p.label, sensor_bundle: p.sensor_bundle, run_names: p.run_names,
  }));
  const body = {
    name, env: cmpEnv, mode, benchmark, policies,
    n_rollouts: parseInt(document.getElementById('col-nroll').value) || 50,
  };
  if (colIsGrid()) {
    const sel = selectedColAxes();
    if (!sel.length) return;
    body.grid_spec = {axes: sel};
    body.grid_n_rollouts = parseInt(document.getElementById('col-grid-nroll').value) || 64;
  }
  colCollecting = true; updateColCollectEnabled();
  const st = document.getElementById('col-status');
  st.className = ''; st.textContent = 'Starting collection…';
  renderSeedProgress([]);           // clear any previous run's rows
  let data;
  try {
    data = await fetch('/api/datasets', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
    }).then(r => r.json());
  } catch (_) { data = {error: 'request failed'}; }
  if (!data || data.error) {
    colCollecting = false; st.className = 'err';
    st.textContent = (data && data.error) || 'Collection failed'; updateColCollectEnabled();
    return;
  }
  await loadDatasets();     // show the new dataset (collecting) right away
  pollCollect(data.compare_id, data.dataset);
}

// One row per seed: which are done, which is on a GPU right now (with sub-seed
// cell progress for grids), which are still queued, which failed.
const SEED_STATE_TEXT = {ready: 'done', queued: 'queued', error: 'failed'};

function renderSeedProgress(runs) {
  const box = document.getElementById('col-progress');
  if (!runs || !runs.length) { box.className = ''; box.innerHTML = ''; return; }
  box.className = 'on';
  box.innerHTML = runs.map(r => {
    let state = SEED_STATE_TEXT[r.status] || r.status;
    if (r.status === 'running') {
      state = r.progress ? `running · ${r.progress}` : 'running';
      if (r.gpu !== undefined && r.gpu !== null) state += ` · GPU ${r.gpu}`;
    }
    const title = r.status === 'error' && r.error ? r.error : `${r.policy || ''} ${r.run_name}`.trim();
    return `
      <div class="seed-row ${r.status}" title="${String(title).replace(/"/g, '&quot;')}">
        <span class="seed-dot ${r.status}"></span>
        <span class="seed-name">${r.run_name}</span>
        <span class="seed-state">${state}</span>
      </div>`;
  }).join('');
}

function pollCollect(cid, slug) {
  const st = document.getElementById('col-status');
  const tick = async () => {
    let data;
    try { data = await fetch(`/api/compare/${cid}?t=${Date.now()}`).then(r => (r.ok ? r.json() : null)); }
    catch (_) { return; }
    if (!data || !data.status) {
      clearInterval(timer); colCollecting = false;
      st.className = 'err'; st.textContent = 'Collection job lost (server restart?).';
      updateColCollectEnabled(); return;
    }
    renderSeedProgress(data.runs);
    if (data.status === 'ready') {
      clearInterval(timer); colCollecting = false;
      st.className = '';
      st.textContent = `Done — ${data.seeds_total}/${data.seeds_total} seeds collected.`;
      updateColCollectEnabled();
      await loadDatasets();
      closeModal('modal-collect');
      selectDataset(slug);
      return;
    }
    const runs = data.runs || [];
    const running = runs.filter(r => r.status === 'running').length;
    const queued = runs.filter(r => r.status === 'queued').length;
    const errored = runs.filter(r => r.status === 'error');
    st.className = errored.length ? 'err' : '';
    let msg = `Collecting — ${data.seeds_done}/${data.seeds_total} seeds done`
            + `  ·  ${running} running  ·  ${queued} queued`;
    if (errored.length) msg += `  ·  ${errored.length} failed: ${errored[0].error ? errored[0].error.slice(0, 80) : ''}`;
    st.textContent = msg;
    // Keep the sidebar count live too — the modal may be closed while this runs.
    loadDatasets();
    if (!running && !queued && errored.length) {
      clearInterval(timer); colCollecting = false; updateColCollectEnabled();
    }
  };
  const timer = setInterval(tick, 1500);
  tick();
}

const CMP_COLORS = COLORS;

// The most recent renderCompareChart() result, kept so the download buttons can
// re-export the underlying data without recomputing.
let lastCompareResult = null;

function cmpDownloadName() {
  const ch = (document.getElementById('cmp-channel').value || 'success').replace(/[^\w.-]+/g, '_');
  return `compare_${ch}`;
}

// Export the rendered Compare chart as a PNG. The modebar is hidden (plotCfg),
// so this is the only way to download; filename follows the success channel.
function downloadCompareChart() {
  const gd = document.getElementById('cmp-chart');
  if (!gd || !gd.data || !gd.data.length) return;
  Plotly.downloadImage(gd, {
    format: 'png', scale: 2,
    width: gd.clientWidth, height: gd.clientHeight,
    filename: cmpDownloadName(),
  });
}

function csvCell(v) {
  const s = String(v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

// Export the underlying curve data (x + each policy's mean/min/max) as CSV, for
// replotting elsewhere. One row per swept threshold; min/max equal mean for
// single-seed policies (no band).
function downloadCompareData() {
  const result = lastCompareResult;
  if (result && result.kind === 'grid_heatmap') { downloadGridData(result); return; }
  if (!result || !result.x || !result.x.length) return;
  const x = result.x;
  const header = [result.xlabel || 'threshold'];
  const columns = [x];
  result.policies.forEach(p => {
    header.push(`${p.label} mean`, `${p.label} min`, `${p.label} max`);
    columns.push(p.mean, p.min, p.max);
  });
  const rows = [header.map(csvCell).join(',')];
  for (let r = 0; r < x.length; r++) {
    rows.push(columns.map(col => csvCell(col[r])).join(','));
  }
  const blob = new Blob([rows.join('\n') + '\n'], {type: 'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${cmpDownloadName()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// Long-format CSV of the currently-shown grid pivot: one row per
// (x, y, policy) cell, for the chosen axis pair and metric.
function downloadGridData(result) {
  const xi = parseInt(document.getElementById('grid-x').value);
  const ySelVal = document.getElementById('grid-y').value;
  const yi = ySelVal === GRID_NONE ? -1 : parseInt(ySelVal);
  const axes = result.axes;
  const xvals = axes[xi].values;
  const yvals = yi < 0 ? [''] : axes[yi].values;
  const header = [axes[xi].name, yi < 0 ? '' : axes[yi].name, 'policy', 'success', 'mean'];
  const rows = [header.map(csvCell).join(',')];
  result.policies.forEach(p => {
    const zs = pivotGrid(p, xi, yi, 'success');
    const zm = pivotGrid(p, xi, yi, 'mean');
    for (let r = 0; r < yvals.length; r++)
      for (let c = 0; c < xvals.length; c++)
        rows.push([xvals[c], yvals[r], p.label, zs[r][c], zm[r][c]].map(csvCell).join(','));
  });
  const blob = new Blob([rows.join('\n') + '\n'], {type: 'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${cmpDownloadName()}_grid.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function renderCompareChart(result) {
  lastCompareResult = result;
  if (result && result.kind === 'grid_heatmap') { setupGridHeatmap(result); return; }
  document.getElementById('cmp-grid-controls').style.display = 'none';
  const x = result.x;
  // X-axis spans the actual swept range so changing sweep_min/sweep_max and
  // regenerating rescales the axis with the data, rather than leaving it pinned
  // to a fixed per-channel default that just clips the lines.
  const xmin = x.length ? x[0] : undefined;
  const xmax = x.length ? x[x.length - 1] : undefined;
  const traces = [];
  const bandForLine = {};   // line trace index -> its band trace index (if any)
  result.policies.forEach((p, i) => {
    const color = CMP_COLORS[i % CMP_COLORS.length];
    // min-max band (skip when a single seed has no spread)
    let bandIdx = null;
    if (p.n_seeds > 1) {
      bandIdx = traces.length;
      traces.push({
        x: [...x, ...x.slice().reverse()],
        y: [...p.max, ...p.min.slice().reverse()],
        fill: 'toself', fillcolor: color + '25', line: {color: 'transparent'},
        type: 'scatter', mode: 'none', showlegend: false, hoverinfo: 'skip',
      });
    }
    if (bandIdx != null) bandForLine[traces.length] = bandIdx;
    traces.push({
      x, y: p.mean, type: 'scatter', mode: 'lines',
      name: `${p.label} (n=${p.n_seeds} seed${p.n_seeds === 1 ? '' : 's'})`,
      line: {color, width: 2},
    });
  });

  const shapes = [], annotations = [];
  if (result.ref) {
    shapes.push({
      type: 'line', x0: result.ref.value, x1: result.ref.value, y0: 0, y1: 100,
      line: {color: '#9ca3af', dash: 'dash', width: 1},
    });
    if (result.ref.label) annotations.push({
      x: result.ref.value, y: 100, yanchor: 'bottom', text: result.ref.label,
      showarrow: false, font: {size: 9, color: '#9ca3af'},
    });
  }

  const skipNote = `skip first ${result.skip_first ?? 0}s (${result.skip_steps ?? 0} steps)`;
  const critNote =
    result.success_mode === 'average' ? `avg error below thr · ${skipNote}`
    : result.success_mode === 'average_above' ? `mean metric above thr · ${skipNote}`
    : `hold ${result.hold_steps} steps`;
  const layout = {
    ...basePlotLayout(result.title || `Success rate vs threshold · ${critNote}`),
    showlegend: true,
    margin: {l: 50, r: 10, t: 28, b: 44},
    xaxis: {
      title: {text: result.xlabel, font: {size: 11}}, gridcolor: '#374151',
      range: xmin != null ? [xmin, xmax] : undefined,
    },
    yaxis: {title: {text: result.ylabel, font: {size: 11}}, gridcolor: '#374151', range: [0, 100]},
    legend: {font: {size: 10}},
    shapes, annotations,
  };
  Plotly.react('cmp-chart', traces, layout, plotCfg);
  document.getElementById('cmp-dl').disabled = false;        // PNG now downloadable
  document.getElementById('cmp-dl-data').disabled = false;   // CSV now downloadable
  // Toggling a policy's line in the legend should also hide/show its min-max
  // band. Pairing is irregular (band only when n_seeds > 1), so look it up.
  const cmpDiv = document.getElementById('cmp-chart');
  cmpDiv._bandForLine = bandForLine;
  if (!cmpDiv._bandToggleWired) {
    cmpDiv._bandToggleWired = true;
    cmpDiv.on('plotly_legendclick', (ev) => {
      const band = cmpDiv._bandForLine[ev.curveNumber];
      if (band == null) return true;
      const lineVisible = cmpDiv.data[ev.curveNumber].visible !== 'legendonly';
      Plotly.restyle(cmpDiv, {visible: lineVisible ? 'legendonly' : true}, [band]);
      return true;  // keep Plotly's default toggle on the clicked line
    });
  }
  setTimeout(resizeCompareChart, 0);
}

// ── grid heatmap ─────────────────────────────────────────────────────────────
// The grid benchmark ships a per-cell metric over the full randomization grid
// (all axes). The viz is pivoted client-side so choosing a different axis pair
// is instant — no re-collect, no server round-trip.
const GRID_NONE = '__none__';   // Y-axis "(none)" → single-row heatmap
let gridSel = {x: null, y: null};

function setupGridHeatmap(result) {
  const axes = result.axes || [];
  const xSel = document.getElementById('grid-x');
  const ySel = document.getElementById('grid-y');
  const axOpts = axes.map((a, i) => `<option value="${i}">${a.label}</option>`).join('');
  xSel.innerHTML = axOpts;
  ySel.innerHTML = `<option value="${GRID_NONE}">(none)</option>` + axOpts;

  // Keep the user's picks across regenerates when still valid, else default to
  // the first two axes (grid_collect orders episode axes first, so X=primary).
  const names = axes.map(a => a.name);
  let xi = names.indexOf(gridSel.x);
  if (xi < 0) xi = 0;
  let yiName = gridSel.y;
  let yi = names.indexOf(yiName);
  if (yiName !== GRID_NONE && yi < 0) yi = axes.length > 1 ? (xi === 0 ? 1 : 0) : -1;
  xSel.value = String(xi);
  ySel.value = yi < 0 ? GRID_NONE : String(yi);

  document.getElementById('cmp-grid-controls').style.display = 'flex';
  renderGridHeatmap();
}

// Enforce distinct X/Y (a heatmap axis against itself is meaningless): if the
// user picks the axis already on the other dropdown, swap them.
function onGridAxisChange(which) {
  const xSel = document.getElementById('grid-x');
  const ySel = document.getElementById('grid-y');
  if (ySel.value !== GRID_NONE && ySel.value === xSel.value) {
    if (which === 'x') ySel.value = gridSel.xIdx != null ? String(gridSel.xIdx) : GRID_NONE;
    else xSel.value = gridSel.yIdx != null ? String(gridSel.yIdx) : xSel.value;
  }
  renderGridHeatmap();
}

// Marginalize: average the per-cell metric over every axis except (xi, yi).
// yi < 0 collapses to a single row (only an X axis chosen).
function pivotGrid(policy, xi, yi, metricKey) {
  const metric = policy[metricKey], ci = policy.cell_index;
  const nx = gridAxisLen(xi), ny = yi < 0 ? 1 : gridAxisLen(yi);
  const sum = Array.from({length: ny}, () => new Float64Array(nx));
  const cnt = Array.from({length: ny}, () => new Float64Array(nx));
  for (let c = 0; c < metric.length; c++) {
    if (metric[c] == null) continue;   // empty sampled bin — don't poison the mean
    const ix = ci[c][xi], iy = yi < 0 ? 0 : ci[c][yi];
    sum[iy][ix] += metric[c]; cnt[iy][ix] += 1;
  }
  return sum.map((row, r) =>
    Array.from(row, (v, cc) => (cnt[r][cc] ? v / cnt[r][cc] : null)));
}

function gridAxisLen(i) {
  return lastCompareResult.axes[i].values.length;
}

function renderGridHeatmap() {
  const result = lastCompareResult;
  if (!result || result.kind !== 'grid_heatmap') return;
  const axes = result.axes;
  const xi = parseInt(document.getElementById('grid-x').value);
  const ySelVal = document.getElementById('grid-y').value;
  const yi = ySelVal === GRID_NONE ? -1 : parseInt(ySelVal);
  gridSel = {x: axes[xi].name, y: yi < 0 ? GRID_NONE : axes[yi].name,
             xIdx: xi, yIdx: yi < 0 ? null : yi};

  // The heatmap always colours by success rate for the selected channel; the
  // channel-mean travels along in the tooltip (customdata) instead of a
  // separate metric dropdown.
  const metrics = result.metrics || [];
  const metricDef = metrics.find(m => m.key === 'success')
    || {label: 'success rate (%)', zmin: 0, zmax: 100};
  const meanLabel = (metrics.find(m => m.key === 'mean') || {}).label || 'mean';
  const pols = result.policies || [];
  if (!pols.length) {
    Plotly.purge('cmp-chart');
    document.getElementById('cmp-chart').innerHTML =
      '<div class="empty" style="padding:20px;color:var(--muted)">No grid data.</div>';
    return;
  }

  const xvals = axes[xi].values;
  const yvals = yi < 0 ? [axes[xi].label] : axes[yi].values;
  const zByPolicy = pols.map(p => pivotGrid(p, xi, yi, 'success'));
  const meanByPolicy = pols.map(p => pivotGrid(p, xi, yi, 'mean'));

  // Shared colour range so subplots are comparable. Success is fixed 0–100;
  // an open-ended metric (mean) is scaled to the data across all policies.
  let zmin = metricDef.zmin, zmax = metricDef.zmax;
  if (zmin == null || zmax == null) {
    let lo = Infinity, hi = -Infinity;
    zByPolicy.forEach(z => z.forEach(row => row.forEach(v => {
      if (v == null) return; if (v < lo) lo = v; if (v > hi) hi = v;
    })));
    if (lo === Infinity) { lo = 0; hi = 1; }
    zmin = zmin == null ? lo : zmin;
    zmax = zmax == null ? hi : zmax;
  }

  const cols = Math.min(pols.length, 3);
  const rows = Math.ceil(pols.length / cols);
  const xTitle = axes[xi].label;
  const yTitle = yi < 0 ? '' : axes[yi].label;
  const traces = [], annotations = [];
  pols.forEach((p, i) => {
    const n = i + 1;                       // Plotly axis suffix (x/y, x2/y2, …)
    const ax = n === 1 ? '' : String(n);
    traces.push({
      type: 'heatmap', z: zByPolicy[i], x: xvals, y: yvals,
      customdata: meanByPolicy[i],
      xaxis: 'x' + n, yaxis: 'y' + n,
      zmin, zmax, colorscale: 'Viridis', zsmooth: false,
      xgap: 1, ygap: 1,
      showscale: i === pols.length - 1,
      colorbar: {title: {text: metricDef.label, side: 'right', font: {size: 10}},
                 thickness: 12, len: 0.9, tickfont: {size: 9}},
      hovertemplate:
        `${xTitle}: %{x}<br>` +
        (yi < 0 ? '' : `${yTitle}: %{y}<br>`) +
        `${metricDef.label}: %{z:.3g}<br>` +
        `${meanLabel}: %{customdata:.3g}<extra></extra>`,
    });
    annotations.push({
      text: `${p.label} (n=${p.n_seeds})`,
      xref: 'x' + n + ' domain', yref: 'y' + n + ' domain',
      x: 0.5, y: 1.0, yanchor: 'bottom', showarrow: false,
      font: {size: 10, color: '#e5e7eb'},
    });
  });

  const thrNote = result.channel
    ? `${result.channel} · thr ${(+result.threshold).toPrecision(3)}`
    : '';
  const layout = {
    ...basePlotLayout(`Grid — ${metricDef.label}${thrNote ? '  ·  ' + thrNote : ''}`),
    grid: {rows, columns: cols, pattern: 'independent', xgap: 0.12, ygap: 0.2},
    margin: {l: 55, r: 20, t: 40, b: 48},
    showlegend: false,
    annotations,
  };
  // Per-subplot axis titles (only the outer edges, to keep it uncluttered).
  pols.forEach((p, i) => {
    const n = i + 1;
    const col = i % cols, row = Math.floor(i / cols);
    layout['xaxis' + (n === 1 ? '' : n)] = {
      title: {text: row === rows - 1 ? xTitle : '', font: {size: 10}},
      gridcolor: '#374151', tickfont: {size: 9}, zeroline: false,
    };
    layout['yaxis' + (n === 1 ? '' : n)] = {
      title: {text: col === 0 && yi >= 0 ? yTitle : '', font: {size: 10}},
      gridcolor: '#374151', tickfont: {size: 9}, zeroline: false,
      showticklabels: yi >= 0,
    };
  });

  Plotly.react('cmp-chart', traces, layout, plotCfg);
  document.getElementById('cmp-dl').disabled = false;
  document.getElementById('cmp-dl-data').disabled = false;
  const g = document.getElementById('grid-hint');
  const extra = axes.filter((_, k) => k !== xi && (yi < 0 || k !== yi));
  g.textContent = extra.length ? 'averaged over ' + extra.map(a => a.name).join(', ') : '';
  setTimeout(resizeCompareChart, 0);
}

// ── start ─────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
