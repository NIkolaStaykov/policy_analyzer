function renderColAxes() {
  const box = document.getElementById('col-grid-axes');
  const list = document.getElementById('col-grid-axes-list');
  box.style.display = '';
  if (!colCands.length) {
    list.innerHTML = '<span class="grid-axis-hint">No sweepable axes for this run.</span>';
    document.getElementById('col-cells').textContent = '';
    return;
  }
  const names = new Set(colCands.map(c => c.name));
  Object.keys(colSel).forEach(k => { if (!names.has(k)) delete colSel[k]; });
  list.innerHTML = colCands.map(c => {
    if (!(c.name in colSel)) colSel[c.name] = {checked: true, points: c.default_points};
    const s = colSel[c.name];
    const hint = `[${(+c.lo).toPrecision(3)}, ${(+c.hi).toPrecision(3)}]${c.kind === 'model' ? ' · model' : ''}`;
    return `<label class="grid-axis-row">
      <input type="checkbox" ${s.checked ? 'checked' : ''}
             onchange="onColAxisToggle('${c.name}', this.checked)">
      <span>${c.label}</span>
      <span class="grid-axis-hint">${hint}</span>
      <input type="number" min="2" max="64" value="${s.points}"
             onchange="onColAxisPoints('${c.name}', this.value)" title="points on this axis">
    </label>`;
  }).join('');
  updateColCells();
}
function onColAxisToggle(name, on) {
  if (colSel[name]) colSel[name].checked = on;
  updateColCells(); updateColCollectEnabled();
}
function onColAxisPoints(name, v) {
  if (colSel[name]) colSel[name].points = Math.max(2, parseInt(v) || 8);
  updateColCells(); updateColCollectEnabled();
}
function selectedColAxes() {
  return colCands
    .filter(c => colSel[c.name] && colSel[c.name].checked)
    .map(c => ({name: c.name, points: colSel[c.name].points}));
}
function gridCellCount(sel) { return sel.reduce((a, x) => a * Math.max(1, x.points), 1); }
function updateColCells() {
  const el = document.getElementById('col-cells');
  const sel = selectedColAxes();
  if (!sel.length) { el.textContent = 'no axes selected'; el.className = 'grid-cells err'; return; }
  const cells = gridCellCount(sel);
  const nroll = parseInt(document.getElementById('col-grid-nroll').value) || 64;
  const over = cells > GRID_MAX_CELLS;
  el.textContent = `${cells} cells × ${nroll} rollouts${over ? `  ⚠ exceeds ${GRID_MAX_CELLS}` : ''}`;
  el.className = 'grid-cells' + (over ? ' err' : '');
}

function updateColCollectEnabled() {
  const btn = document.getElementById('col-collect');
  if (!btn) return;
  let axesOk = true;
  if (colIsGrid()) {
    const sel = selectedColAxes();
    axesOk = sel.length > 0 && gridCellCount(sel) <= GRID_MAX_CELLS;
  }
  const name = document.getElementById('col-name').value.trim();
  btn.disabled = selectedPolicies.size === 0 || !name || !axesOk || colCollecting;
  const st = document.getElementById('col-status');
  if (!colCollecting) {
    st.className = '';
    st.textContent = selectedPolicies.size
      ? `${selectedPolicies.size} polic${selectedPolicies.size === 1 ? 'y' : 'ies'}${cmpEnv ? ' · ' + cmpEnv : ''}`
      : 'Select policies to include.';
  }
}

// ── visualization (drives off the selected dataset) ──────────────────────────
function isHeatmap() { return document.getElementById('cmp-viz').value === 'heatmap'; }
function datasetIsGrid() { return !!(currentDataset && currentDataset.benchmark === 'grid'); }

// Scoring-field visibility follows the visualization: curves sweep a threshold on
// x; a heatmap judges at a single Threshold.
function syncVizFields() {
  const heat = isHeatmap();
  document.getElementById('cmp-threshold-field').style.display = heat ? '' : 'none';
  document.querySelectorAll('.cmp-sweep-field').forEach(
    el => { el.style.display = heat ? 'none' : ''; });
}

async function onVisualizationChange() {
  syncVizFields();

  refreshViewState();
}

// Load the env's default channel/criterion into the viz form when a dataset is
// selected (only when the env changes, to preserve the user's tweaks).
async function loadVizConfig(env) {
  if (env === appliedConfigEnv) return;
  let cfg = cmpConfigCache[env];
  if (!cfg) {
    cfg = await fetch(`/api/compare/config?env=${encodeURIComponent(env)}`).then(r => r.json());
    cmpConfigCache[env] = cfg;

  applyCompareConfig(cfg);

}

// Bin centers for a sampled-heatmap axis, mirroring grid_collect._gen_values so
// sampled bins line up with grid cells (geometric for log2, sign-mirror for
// symmetric, dropped duplicate endpoint for a full-circle wrap).
function genAxisCenters(c, n) {
  const lo = +c.lo, hi = +c.hi;
  let vals;
  if (c.space === 'log2') {
    vals = Array.from({length: n}, (_, i) => n === 1 ? lo : lo * Math.pow(hi / lo, i / (n - 1)));
  } else {
    const full = c.wrap && Math.abs((hi - lo) - 2 * Math.PI) < 1e-9;
    const denom = full ? n : (n - 1);
    vals = Array.from({length: n}, (_, i) => n === 1 ? lo : lo + (hi - lo) * i / denom);
  }
  if (c.symmetric) {
    const s = new Set();
    vals.forEach(v => { s.add(-v); s.add(v); });
    vals = [...s].sort((a, b) => a - b);
  }
  return vals;
}

// ── visualization: sampled BIN axis selector (post-hoc, live re-bin) ─────────

const binSel = {};

    && currentDataset.policies[0].run_names && currentDataset.policies[0].run_names[0];
  if (!(currentDataset && isHeatmap() && !datasetIsGrid()) || !run) { box.style.display = 'none'; return; }
  let cands = [];
  try {

      `/api/compare/grid_axes?run=${encodeURIComponent(run)}&env=${encodeURIComponent(currentDataset.env)}`
    ).then(r => r.json());
  } catch (_) { cands = []; }

function renderBinAxes() {

  Object.keys(binSel).forEach(k => { if (!names.has(k)) delete binSel[k]; });
  list.innerHTML = binCands.map(c => {
    if (!(c.name in binSel)) binSel[c.name] = {checked: true, points: c.default_points};
    const s = binSel[c.name];
    const hint = `[${(+c.lo).toPrecision(3)}, ${(+c.hi).toPrecision(3)}]`;
    return `<label class="grid-axis-row">
      <input type="checkbox" ${s.checked ? 'checked' : ''}
             onchange="onBinAxisToggle('${c.name}', this.checked)">
      <span>${c.label}</span>
      <span class="grid-axis-hint">${hint}</span>
      <input type="number" min="2" max="64" value="${s.points}"
             onchange="onBinAxisPoints('${c.name}', this.value)" title="bins on this axis">
    </label>`;
  }).join('');
  updateBinCells();
}
function onBinAxisToggle(name, on) {
  if (binSel[name]) binSel[name].checked = on;
  updateBinCells();
  refreshViewState();
}
function onBinAxisPoints(name, v) {
  if (binSel[name]) binSel[name].points = Math.max(2, parseInt(v) || 8);
  updateBinCells();
  refreshViewState();
}
function selectedBinAxes() {
  return binCands
    .filter(c => c.channel && binSel[c.name] && binSel[c.name].checked)

      name: c.name, label: c.label, channel: c.channel,

    }));
}
function updateBinCells() {
  const el = document.getElementById('viz-bin-cells');
  const sel = binCands.filter(c => binSel[c.name] && binSel[c.name].checked);
  const cells = sel.reduce((a, c) => a * Math.max(1, binSel[c.name].points), 1);
  el.textContent = sel.length ? `${cells} bins` : 'no bin axes selected';
  el.className = 'grid-cells' + (sel.length ? '' : ' err');
}

// ── policy subset selector ───────────────────────────────────────────────────
// A sweep dataset can hold dozens of policies; only the ones ticked here go into
// the view. Seeds still average into each heatmap cell exactly as before — this
// chooses which policies contribute at all.
const polSel = new Set();       // labels of the policies included in the view

function datasetPolicies() { return (currentDataset && currentDataset.policies) || []; }
function datasetPolicyAxes() { return (currentDataset && currentDataset.policy_axes) || []; }

// Request shape for /api/compare/view; the server re-reads attrs from configs.
function selectedDatasetPolicies() {
  return datasetPolicies()
    .filter(p => polSel.has(p.label))
    .map(p => ({label: p.label, sensor_bundle: p.sensor_bundle, run_names: p.run_names}));
}

function resetPolicySelection() {
  polSel.clear();
  datasetPolicies().forEach(p => polSel.add(p.label));
}

// Attribute values are matched as strings throughout (axis values and per-policy
// values are both JSON numbers or strings, so this pairs them either way).
function attrValue(p, name) {
  const v = (p.attrs || {})[name];
  return v == null ? '' : String(v);
}

function renderPolicySelector() {
  const box = document.getElementById('cmp-policies');
  const pols = datasetPolicies();
  if (!pols.length) { box.style.display = 'none'; return; }
  box.style.display = '';
  const cnt = document.getElementById('cmp-pol-count');
  cnt.textContent = `${polSel.size}/${pols.length} selected`;
  cnt.className = 'grid-cells' + (polSel.size ? '' : ' err');

  // One chip row per varying config knob: clicking a value ticks (or unticks)
  // every policy carrying it — the quick way to isolate "the kp=8 runs".
  document.getElementById('cmp-policy-attrs').innerHTML = datasetPolicyAxes().map((ax, ai) => {
    const chips = ax.values.map((v, vi) => {
      const matching = pols.filter(p => attrValue(p, ax.name) === String(v));
      const on = matching.filter(p => polSel.has(p.label)).length;
      const cls = on === 0 ? '' : (on === matching.length ? ' on' : ' mixed');
      return `<button class="pol-chip${cls}" title="${matching.length} policies" onclick="onPolicyChip(${ai}, ${vi})">${v}</button>`;
    }).join('');
    return `<span class="pol-attr"><span>${ax.label}</span>${chips}</span>`;
  }).join('');

  document.getElementById('cmp-policy-list').innerHTML = pols.map((p, i) => `
    <label class="pol-row" title="${p.run_names.length} seed${p.run_names.length === 1 ? '' : 's'}">
      <input type="checkbox" ${polSel.has(p.label) ? 'checked' : ''}
             onchange="onPolicyToggle(${i}, this.checked)">
      <span>${p.label}</span>
    </label>`).join('');
}

function onPolicyToggle(i, on) {
  const p = datasetPolicies()[i];
  if (!p) return;
  if (on) polSel.add(p.label); else polSel.delete(p.label);
  renderPolicySelector();
  refreshViewState();
}

function onPolicyChip(ai, vi) {
  const ax = datasetPolicyAxes()[ai];
  if (!ax) return;
  const val = String(ax.values[vi]);
  const matching = datasetPolicies().filter(p => attrValue(p, ax.name) === val);
  // Fully ticked → drop them all; otherwise tick the rest.
  const allOn = matching.every(p => polSel.has(p.label));
  matching.forEach(p => allOn ? polSel.delete(p.label) : polSel.add(p.label));
  renderPolicySelector();
  refreshViewState();
}

function setAllPolicies(on) {
  if (on) resetPolicySelection(); else polSel.clear();
  renderPolicySelector();
  refreshViewState();
}

// The checkbox list can grow long; let the header caret fold it away. The count
// and all/none controls stay put so the selection is still legible when folded.
function togglePolicyList() {
  document.getElementById('cmp-policies').classList.toggle('pol-collapsed');
}

// ── render gate ──────────────────────────────────────────────────────────────
// Scoring, policy and bin-axis edits don't render on their own: rendering costs
// a server round-trip over the whole cache, and a half-finished selection is
// rarely the one the user means. They mark the view stale instead and wait for
// ▶ Generate Plot. (The grid X/Y axis dropdowns are exempt — that pivot is a
// client-side re-fold of the result already in hand.)
let viewRendering = false;        // a /api/compare/view request is in flight
let viewRequestedSlug = null;     // dataset the user last asked to render
let lastRenderedSig = null;       // viewSignature() of the plot on screen
let lastRenderCached = false;     // that plot came back from the server's view cache

// Everything that decides what comes back from /api/compare/view. Comparing this
// against the plot on screen is what greys the button out: unticking a policy and
// re-ticking it lands back on the same signature, so there is nothing to
// generate. Null on failure, so a failed render is always retryable.
function viewSignature() {
  if (!currentDataset) return null;
  return JSON.stringify({
    slug: currentDataset.slug,
    visualization: document.getElementById('cmp-viz').value,
    criterion: buildCriterion(),
    policies: selectedDatasetPolicies().map(p => p.label).sort(),
  });
}

function viewIsStale() {
  const sig = viewSignature();
  return sig != null && sig !== lastRenderedSig;
}

function updateGenerateEnabled() {
  document.getElementById('cmp-gen').disabled =
    !currentDataset || viewRendering || !viewIsStale();
}

// Called by every control that feeds the view: re-checks whether the settings
// have actually moved away from what is plotted, and says so.
function refreshViewState() {
  if (!currentDataset) return;
  saveViewState();   // every control that feeds the view also comes back with it
  updateGenerateEnabled();
  if (viewRendering) return;   // the in-flight render owns the status line
  const st = document.getElementById('cmp-status');
  if (!viewIsStale()) {
    if (lastCompareResult) {
      st.className = '';
      st.textContent = lastRenderCached ? 'Up to date (cached plot).' : 'Up to date.';
    }
    return;
  }
  st.className = '';
  st.textContent = lastCompareResult
    ? 'Settings changed — press ▶ Generate Plot to update.'
    : 'Press ▶ Generate Plot to render.';
}

// Drop the current plot. Called before every render so a stale chart is never
// left on screen passing for the one being generated.
function clearCompareChart(msg) {
  lastCompareResult = null;
  lastRenderedSig = null;   // nothing on screen, so nothing matches the settings
  const el = document.getElementById('cmp-chart');
  Plotly.purge('cmp-chart');
  // purge() drops the div's Plotly listeners too, so the band-toggle handler
  // has to be re-wired on the next render.
  el._bandToggleWired = false;
  el.innerHTML = msg ? `<div class="cmp-placeholder">${msg}</div>` : '';
  document.getElementById('cmp-grid-controls').style.display = 'none';
  document.getElementById('cmp-dl').disabled = true;
  document.getElementById('cmp-dl-data').disabled = true;
}

// Plotly builds its frame alongside whatever is already in the container, so a
// placeholder has to be taken out by hand before plotting over it.
function clearChartPlaceholder() {
  document.getElementById('cmp-chart')
    .querySelectorAll('.cmp-placeholder, .empty').forEach(n => n.remove());
}

function applyCompareConfig(cfg) {
  const chSel = document.getElementById('cmp-channel');
  const channels = cfg.available_channels && cfg.available_channels.length
    ? cfg.available_channels
    : (cfg.channel ? [cfg.channel] : []);
  const prev = chSel.value;
  chSel.innerHTML = channels.length
    ? channels.map(c => `<option value="${c}">${c}</option>`).join('')
    : '<option value="">(run once to discover channels)</option>';
  // Keep the user's pick if still valid, else use the config default.
  chSel.value = channels.includes(prev) ? prev
    : (channels.includes(cfg.channel) ? cfg.channel : (channels[0] || ''));
  document.getElementById('cmp-abs').checked = !!cfg.abs;
  document.getElementById('cmp-smin').value = cfg.sweep_min;
  document.getElementById('cmp-smax').value = cfg.sweep_max;
  document.getElementById('cmp-npts').value = cfg.n_points;
  document.getElementById('cmp-hold').value = cfg.hold_steps;
  document.getElementById('cmp-skip').value = cfg.skip_first != null ? cfg.skip_first : 0;
  document.getElementById('cmp-smode').value = cfg.success_mode || 'hold';
  onSuccessModeChange();   // show the field that matches the criterion
  // Grid's single Threshold: default to the env's reference value, else the
  // sweep midpoint (the same value compute_grid_heatmap would fall back to).
  document.getElementById('cmp-threshold').value = cfg.ref_value != null
    ? cfg.ref_value
    : 0.5 * ((parseFloat(cfg.sweep_min) || 0) + (parseFloat(cfg.sweep_max) || 0));
  // Stash non-edited config (units/labels/ref) for the POST + plot.
  document.getElementById('cmp-controls').dataset.cfg = JSON.stringify(cfg);
}

// Show only the parameter relevant to the chosen success criterion: hold-steps
// for the sequential-hold mode, skip-first for either rollout-average mode.
function onSuccessModeChange() {
  const avg = document.getElementById('cmp-smode').value.startsWith('average');
  document.getElementById('cmp-hold-field').style.display = avg ? 'none' : '';
  document.getElementById('cmp-skip-field').style.display = avg ? '' : 'none';
}

async function openRunAnalysis(run_name) {
  // Reuse the existing session flow to inspect one training run's details.
  const resp = await fetch('/api/sessions', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({run: run_name, checkpoint_step: 'latest', n_det: 3, n_sto: 3}),
  });
  const {session_id} = await resp.json();
  rolloutData = {};
  window.location.hash = `sid=${session_id}`;
  await refreshSessionList();
  await loadSession(session_id);
  switchTab('ses');
  startStream();
}

function buildCriterion() {
  const base = JSON.parse(document.getElementById('cmp-controls').dataset.cfg || '{}');
  const thrRaw = document.getElementById('cmp-threshold').value;
  const crit = {
    ...base,
    channel: document.getElementById('cmp-channel').value,
    abs: document.getElementById('cmp-abs').checked,
    // Heatmap's single judging threshold; null lets the server fall back to
    // ref_value / midpoint. Ignored by the curve path (it sweeps instead).
    threshold: thrRaw === '' ? null : parseFloat(thrRaw),
    sweep_min: parseFloat(document.getElementById('cmp-smin').value),
    sweep_max: parseFloat(document.getElementById('cmp-smax').value),
    n_points: parseInt(document.getElementById('cmp-npts').value) || 151,
    success_mode: document.getElementById('cmp-smode').value,
    hold_steps: parseInt(document.getElementById('cmp-hold').value) || 10,
    skip_first: parseFloat(document.getElementById('cmp-skip').value) || 0,
  };
  // Sampled heatmap: how to bin the pool. Grid heatmaps ignore this (they use
  // the cache's pinned cell_values); curves ignore it entirely.
  if (isHeatmap() && !datasetIsGrid()) crit.heatmap_axes = selectedBinAxes();
  return crit;
}

// A scoring / visualization / bin-axis change only stales the view; ▶ Generate
// Plot re-renders it from cache (no GPU, no re-collect) — the whole point of
// saved datasets.
function onScoringChange() {
  refreshViewState();
}

// `cacheOnly` asks the server for a previously rendered view and nothing more:
// it never starts a computation, so a miss is silent and just leaves the usual
// "press ▶ Generate Plot" state standing. Used when a dataset is opened.
async function viewScore({cacheOnly = false} = {}) {
  if (!currentDataset || viewRendering) return;
  const criterion = buildCriterion();
  const st = document.getElementById('cmp-status');
  // Nothing to plot: drop the old chart too, so the status line isn't explaining
  // a blocked render next to a plot that looks like its answer.
  const bail = (msg) => {
    if (cacheOnly) return;
    st.className = ''; st.textContent = msg; clearCompareChart(msg);
  };
  if (!criterion.channel) { bail('Pick a success channel.'); return; }
  const policies = selectedDatasetPolicies();
  if (!policies.length) { bail('Select at least one policy.'); return; }
  const sig = viewSignature();   // what this render will put on screen
  const reqSlug = currentDataset.slug;
  viewRendering = true;
  if (!cacheOnly) viewRequestedSlug = reqSlug;   // a peek isn't a request to render
  updateGenerateEnabled();
  // Never leave the previous plot standing in for the one being fetched.
  clearCompareChart(cacheOnly ? 'Loading cached plot…' : 'Generating…');
  st.className = ''; st.textContent = '';   // the chart placeholder carries the message
  try {
    const data = await fetch('/api/compare/view', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        mode: currentDataset.mode, benchmark: currentDataset.benchmark,
        visualization: document.getElementById('cmp-viz').value,
        criterion, policies, grid_spec: currentDataset.grid_spec,
        // Names the dataset whose rendered-view cache this reads and writes.
        dataset: reqSlug, cache_only: cacheOnly,
      }),
    }).then(r => r.json());
    // The user moved on while this was in flight — plotting now would hang a
    // stale chart under another dataset's controls.
    if (!currentDataset || currentDataset.slug !== reqSlug) return;
    if (data && data.result) {
      lastRenderedSig = sig;
      lastRenderCached = !!data.cached;
      st.className = '';
      st.textContent = lastRenderCached ? 'Up to date (cached plot).' : 'Up to date.';
      renderCompareChart(data.result);
    } else if (cacheOnly) {
      // No cached view for these settings — say so the same way an untouched
      // dataset does, and wait for the button.
      clearCompareChart('Press ▶ Generate Plot to render this dataset.');
    } else {
      st.className = 'err';
      if (data && data.error === 'not collected') {
        const d = datasets.find(x => x.slug === currentDataset.slug);
        st.textContent = d && d.seeds_total
          ? `Dataset still collecting — ${d.seeds_done}/${d.seeds_total} seeds done; renders automatically when complete.`
          : 'Dataset still collecting — renders automatically when complete.';
      } else {
        st.textContent = 'Re-view failed.';
      }
      lastRenderedSig = null;   // nothing plotted — leave the button live to retry
      clearCompareChart(st.textContent);
    }
  } catch (_) {
    if (cacheOnly) {
      clearCompareChart('Press ▶ Generate Plot to render this dataset.');
    } else {
      st.className = 'err'; st.textContent = 'Re-view failed.';
      lastRenderedSig = null;
      clearCompareChart(st.textContent);
    }
  } finally {
    viewRendering = false;
    // Edits made while the request was in flight aren't in this plot; re-checking
    // the signature both re-enables the button and says so.
    refreshViewState();
    updateGenerateEnabled();
  }
}

// ── dataset sidebar ──────────────────────────────────────────────────────────
async function loadDatasets() {
  datasetsLoaded = true;
  const wasCollecting = new Set(
    datasets.filter(d => d.status === 'collecting').map(d => d.slug));
  try { datasets = await fetch('/api/datasets').then(r => r.json()); } catch (_) { datasets = []; }
  if (!Array.isArray(datasets)) datasets = [];
  renderDatasetList();
  pruneViewStates();
  // A dataset the user already asked to plot, that was still collecting at the
  // time: honour that request once the data lands, as the status line promised.
  if (currentDataset && wasCollecting.has(currentDataset.slug)
      && viewRequestedSlug === currentDataset.slug
      && datasets.some(d => d.slug === currentDataset.slug && d.status === 'ready')) {
    viewScore();
  }
  ensureDatasetPolling();
}

// Refresh the sidebar while anything is collecting, so seed counts stay live
// even with the collect modal closed or after a page reload mid-collection.
let datasetPollTimer = null;
function ensureDatasetPolling() {
  const collecting = datasets.some(d => d.status === 'collecting');
  if (collecting && !datasetPollTimer) {
    datasetPollTimer = setInterval(loadDatasets, 3000);
  } else if (!collecting && datasetPollTimer) {
    clearInterval(datasetPollTimer); datasetPollTimer = null;
  }
}

// "collecting 3/6" while running, plain status otherwise.
function datasetStatusText(d) {
  return d.status === 'collecting' && d.seeds_total
    ? `collecting ${d.seeds_done}/${d.seeds_total} seeds`
    : d.status;
}

function renderDatasetList() {
  const el = document.getElementById('dataset-list');
  if (!datasets.length) {
    el.innerHTML = '<div class="empty">No datasets yet — click ＋ Collect new dataset.</div>';
    return;
  }
  el.innerHTML = datasets.map(d => `
    <div class="dataset-item ${currentDataset && currentDataset.slug === d.slug ? 'sel' : ''}"
         onclick="selectDataset('${d.slug}')">
      <span class="ds-dot ${d.status}" title="${datasetStatusText(d)}"></span>
      <div class="ds-body">
        <div class="ds-name" title="${d.name}">${d.name}</div>
        <div class="ds-meta">${d.benchmark} · ${d.n_policies} polic${d.n_policies === 1 ? 'y' : 'ies'} · ${datasetStatusText(d)}</div>
      </div>
      <button class="ds-del" title="Delete dataset"
              onclick="event.stopPropagation(); onDeleteDataset('${d.slug}')">🗑</button>
    </div>`).join('');
}

// ── remembered view state ────────────────────────────────────────────────────
// Coming back to a dataset comes back to the view it was left on — the same
// visualization, criterion, policy subset and grid pivot — rather than resetting
// to the env defaults. Kept per slug in localStorage so it survives a reload and
// a server restart; the plot itself comes back from the server's view cache, so
// the restored view is usually on screen without recomputing anything.
const VIEW_STATE_KEY = 'cmpViewState';
const LAST_DATASET_KEY = 'cmpLastDataset';
const VIEW_FIELDS = ['cmp-viz', 'cmp-channel', 'cmp-smode', 'cmp-threshold',
                     'cmp-smin', 'cmp-smax', 'cmp-npts', 'cmp-hold', 'cmp-skip'];

function readViewStates() {
  try { return JSON.parse(localStorage.getItem(VIEW_STATE_KEY) || '{}') || {}; }
  catch (_) { return {}; }
}

function writeViewStates(all) {
  // Best-effort: a full or unavailable localStorage must not break the tab.
  try { localStorage.setItem(VIEW_STATE_KEY, JSON.stringify(all)); } catch (_) {}
}

function captureViewState() {
  const st = {fields: {}, abs: document.getElementById('cmp-abs').checked,
              policies: [...polSel], bins: JSON.parse(JSON.stringify(binSel))};
  VIEW_FIELDS.forEach(id => { st.fields[id] = document.getElementById(id).value; });
  // The grid pivot is held by axis *id*, not index, so it survives the axis
  // list being renumbered by a different criterion or policy subset.
  st.grid = {x: gridSel.x, y: gridSel.y, col: facetSel.col, row: facetSel.row,
             pages: {...pageSel}, ref: gridRef, summaryPrev};
  return st;
}

function saveViewState() {
  if (!currentDataset) return;
  const all = readViewStates();
  all[currentDataset.slug] = captureViewState();
  writeViewStates(all);
  try { localStorage.setItem(LAST_DATASET_KEY, currentDataset.slug); } catch (_) {}
}

// Drop states for datasets that no longer exist (deleted from another tab, or a
// wiped analysis dir). Skipped on an empty list, which is also what a failed
// fetch looks like — that must not erase every remembered view.
function pruneViewStates() {
  if (!datasets.length) return;
  const live = new Set(datasets.map(d => d.slug));
  const all = readViewStates();
  const stale = Object.keys(all).filter(s => !live.has(s));
  if (!stale.length) return;
  stale.forEach(s => delete all[s]);
  writeViewStates(all);
}

function forgetViewState(slug) {
  const all = readViewStates();
  delete all[slug];
  writeViewStates(all);
  try {
    if (localStorage.getItem(LAST_DATASET_KEY) === slug) {
      localStorage.removeItem(LAST_DATASET_KEY);
    }
  } catch (_) {}
}

// Returns false when this dataset has no remembered view, leaving the caller's
// defaults standing.
function applyViewState(slug) {
  const st = readViewStates()[slug];
  if (!st) return false;
  VIEW_FIELDS.forEach(id => {
    const el = document.getElementById(id);
    const prev = el.value;
    if (st.fields[id] == null) return;
    el.value = st.fields[id];
    // A remembered channel this env no longer offers (or a dropped criterion)
    // leaves the select empty — keep the default in that case.
    if (el.tagName === 'SELECT' && el.selectedIndex < 0) el.value = prev;
  });
  document.getElementById('cmp-abs').checked = !!st.abs;
  // Policies are matched by label: a re-collected dataset may have gained or
  // lost some, and a remembered set that no longer matches anything falls back
  // to the whole dataset rather than to an unplottable empty selection.
  const known = new Set(datasetPolicies().map(p => p.label));
  const keep = (st.policies || []).filter(l => known.has(l));
  if (keep.length) { polSel.clear(); keep.forEach(l => polSel.add(l)); }
  // Bin axes are re-offered by refreshBinAxes(), which keeps whatever is already
  // in binSel and prunes what this dataset has no axis for.
  Object.keys(binSel).forEach(k => delete binSel[k]);
  Object.assign(binSel, st.bins || {});
  const g = st.grid || {};
  gridSel = {x: g.x || null, y: g.y || null};
  facetSel = {col: g.col || GRID_NONE, row: g.row || GRID_NONE};
  facetInit = slug;        // restored facets stand in for the per-dataset defaults
  pageSel = g.pages || {};
  gridRef = g.ref || null;
  summaryPrev = g.summaryPrev || null;
  return true;
}

async function selectDataset(slug) {
  let meta;
  try { meta = await fetch(`/api/datasets/${encodeURIComponent(slug)}`).then(r => r.json()); }
  catch (_) { return; }
  if (!meta || !meta.slug) return;
  currentDataset = meta;
  renderDatasetList();
  resetPolicySelection();          // every policy, unless a remembered view says otherwise
  await loadVizConfig(meta.env);   // channel / criterion defaults for this env…
  applyViewState(slug);            // …then the view this dataset was last left on
  renderPolicySelector();
  syncVizFields();
  await refreshBinAxes();
  // Switching datasets drops the old plot rather than leaving another dataset's
  // chart under the new one's controls.
  viewRequestedSlug = null;
  clearCompareChart('Press ▶ Generate Plot to render this dataset.');
  refreshViewState();
  // The settings now on screen are the ones this view was last rendered with, so
  // the server has it cached — put it straight back up. A miss computes nothing
  // and leaves the button waiting.
  await viewScore({cacheOnly: true});
}

// Reopening the tab returns to the dataset last worked on, with its view.
async function restoreLastDataset() {
  if (currentDataset) return;
  let slug = null;
  try { slug = localStorage.getItem(LAST_DATASET_KEY); } catch (_) {}
  if (slug && datasets.some(d => d.slug === slug)) await selectDataset(slug);
}

async function onDeleteDataset(slug) {
  try { await fetch(`/api/datasets/${encodeURIComponent(slug)}`, {method: 'DELETE'}); } catch (_) {}
  forgetViewState(slug);   // its views are gone server-side too
  if (currentDataset && currentDataset.slug === slug) {
    currentDataset = null;
    polSel.clear();
    viewRequestedSlug = null;
    clearCompareChart();
    updateGenerateEnabled();
    document.getElementById('viz-bin-axes').style.display = 'none';
    document.getElementById('cmp-policies').style.display = 'none';
    const st = document.getElementById('cmp-status'); st.className = ''; st.textContent = 'Select a dataset to visualize.';
  }
  await loadDatasets();
}

// ── collect modal ────────────────────────────────────────────────────────────
function openCollectModal() {
  openModal('modal-collect');
  if (!queuesLoaded) loadQueues();
  updateColCollectEnabled();
}

async function onCollectDataset() {
  const name = document.getElementById('col-name').value.trim();
  if (!name || !selectedPolicies.size) return;
  const benchmark = document.getElementById('col-benchmark').value || 'default';
  const mode = document.getElementById('col-mode').value;
  const policies = [...selectedPolicies.values()].map(p => ({
    label: p.label, sensor_bundle: p.sensor_bundle, run_names: p.run_names,
  }));
  const body = {
    name, env: cmpEnv, mode, benchmark, policies,
    n_rollouts: parseInt(document.getElementById('col-nroll').value) || 50,
  };
  if (colIsGrid()) {
    const sel = selectedColAxes();
    if (!sel.length) return;
    body.grid_spec = {axes: sel};
    body.grid_n_rollouts = parseInt(document.getElementById('col-grid-nroll').value) || 64;
  }
  colCollecting = true; updateColCollectEnabled();
  const st = document.getElementById('col-status');
  st.className = ''; st.textContent = 'Starting collection…';
  renderSeedProgress([]);           // clear any previous run's rows
  let data;
  try {
    data = await fetch('/api/datasets', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
    }).then(r => r.json());
  } catch (_) { data = {error: 'request failed'}; }
  if (!data || data.error) {
    colCollecting = false; st.className = 'err';
    st.textContent = (data && data.error) || 'Collection failed'; updateColCollectEnabled();
    return;
  }
  await loadDatasets();     // show the new dataset (collecting) right away
  pollCollect(data.compare_id, data.dataset);
}

// One row per seed: which are done, which is on a GPU right now (with sub-seed
// cell progress for grids), which are still queued, which failed.
const SEED_STATE_TEXT = {ready: 'done', queued: 'queued', error: 'failed'};

function renderSeedProgress(runs) {
  const box = document.getElementById('col-progress');
  if (!runs || !runs.length) { box.className = ''; box.innerHTML = ''; return; }
  box.className = 'on';
  box.innerHTML = runs.map(r => {
    let state = SEED_STATE_TEXT[r.status] || r.status;
    if (r.status === 'running') {
      state = r.progress ? `running · ${r.progress}` : 'running';
      if (r.gpu !== undefined && r.gpu !== null) state += ` · GPU ${r.gpu}`;
    }
    const title = r.status === 'error' && r.error ? r.error : `${r.policy || ''} ${r.run_name}`.trim();
    return `
      <div class="seed-row ${r.status}" title="${String(title).replace(/"/g, '&quot;')}">
        <span class="seed-dot ${r.status}"></span>
        <span class="seed-name">${r.run_name}</span>
        <span class="seed-state">${state}</span>
      </div>`;
  }).join('');
}

function pollCollect(cid, slug) {
  const st = document.getElementById('col-status');
  const tick = async () => {
    let data;
    try { data = await fetch(`/api/compare/${cid}?t=${Date.now()}`).then(r => (r.ok ? r.json() : null)); }
    catch (_) { return; }
    if (!data || !data.status) {
      clearInterval(timer); colCollecting = false;
      st.className = 'err'; st.textContent = 'Collection job lost (server restart?).';
      updateColCollectEnabled(); return;
    }
    renderSeedProgress(data.runs);
    if (data.status === 'ready') {
      clearInterval(timer); colCollecting = false;
      st.className = '';
      st.textContent = `Done — ${data.seeds_total}/${data.seeds_total} seeds collected.`;
      updateColCollectEnabled();
      await loadDatasets();
      closeModal('modal-collect');
      selectDataset(slug);
      return;
    }
    const runs = data.runs || [];
    const running = runs.filter(r => r.status === 'running').length;
    const queued = runs.filter(r => r.status === 'queued').length;
    const errored = runs.filter(r => r.status === 'error');
    st.className = errored.length ? 'err' : '';
    let msg = `Collecting — ${data.seeds_done}/${data.seeds_total} seeds done`
            + `  ·  ${running} running  ·  ${queued} queued`;
    if (errored.length) msg += `  ·  ${errored.length} failed: ${errored[0].error ? errored[0].error.slice(0, 80) : ''}`;
    st.textContent = msg;
    // Keep the sidebar count live too — the modal may be closed while this runs.
    loadDatasets();
    if (!running && !queued && errored.length) {
      clearInterval(timer); colCollecting = false; updateColCollectEnabled();
    }
  };
  const timer = setInterval(tick, 1500);
  tick();
}

const CMP_COLORS = COLORS;

// The most recent renderCompareChart() result, kept so the download buttons can
// re-export the underlying data without recomputing.
let lastCompareResult = null;

function cmpDownloadName() {
  const ch = (document.getElementById('cmp-channel').value || 'success').replace(/[^\w.-]+/g, '_');
  return `compare_${ch}`;
}

// Export the rendered Compare chart as a PNG. The modebar is hidden (plotCfg),
// so this is the only way to download; filename follows the success channel.
function downloadCompareChart() {
  const gd = document.getElementById('cmp-chart');
  if (!gd || !gd.data || !gd.data.length) return;
  // A grid heatmap can be taller than the pane it scrolls in — export the whole
  // figure, not the visible slice.
  const fl = gd._fullLayout || {};
  Plotly.downloadImage(gd, {
    format: 'png', scale: 2,
    width: fl.width || gd.clientWidth, height: fl.height || gd.clientHeight,
    filename: cmpDownloadName(),
  });
}

function csvCell(v) {
  const s = String(v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

// Export the underlying curve data (x + each policy's mean/min/max) as CSV, for
// replotting elsewhere. One row per swept threshold; min/max equal mean for
// single-seed policies (no band).
function downloadCompareData() {
  const result = lastCompareResult;
  if (result && result.kind === 'grid_heatmap') { downloadGridData(result); return; }
  if (!result || !result.x || !result.x.length) return;
  const x = result.x;
  const header = [result.xlabel || 'threshold'];
  const columns = [x];
  result.policies.forEach(p => {
    header.push(`${p.label} mean`, `${p.label} min`, `${p.label} max`);
    columns.push(p.mean, p.min, p.max);
  });
  const rows = [header.map(csvCell).join(',')];
  for (let r = 0; r < x.length; r++) {
    rows.push(columns.map(col => csvCell(col[r])).join(','));
  }
  const blob = new Blob([rows.join('\n') + '\n'], {type: 'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${cmpDownloadName()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// Long-format CSV of the currently-shown grid pivot: one row per (x, y, panel)
// cell, for the chosen axis pair. Panels are identified by their facet
// coordinates and the policies pooled into them; the exported metrics are always
// the raw ones, so a Δ view still writes out what each panel actually scored.
function downloadGridData(result) {
  const xi = parseInt(document.getElementById('grid-x').value);
  const ySelVal = document.getElementById('grid-y').value;
  const yi = ySelVal === GRID_NONE ? -1 : parseInt(ySelVal);
  const axes = allAxes();
  const xvals = axisTicks(xi);
  const yvals = yi < 0 ? [''] : axisTicks(yi);
  const fg = facetGrid(result.policies || [], xi, yi);
  const header = [axes[xi].name, yi < 0 ? '' : axes[yi].name,
                  fg.colAx ? fg.colAx.name : 'facet_col',
                  fg.rowAx ? fg.rowAx.name : 'facet_row',
                  'policies', 'n_seeds', 'success', 'mean'];
  const rows = [header.map(csvCell).join(',')];
  fg.cells.forEach((row, ri) => row.forEach((cell, ci) => {
    if (!cell) return;
    const zs = pivotCells(cell.pols, xi, yi, 'success');
    const zm = pivotCells(cell.pols, xi, yi, 'mean');
    const names = cell.pols.map(p => p.label).join(' + ');
    const seeds = cell.pols.reduce((a, p) => a + p.n_seeds, 0);
    for (let r = 0; r < yvals.length; r++)
      for (let c = 0; c < xvals.length; c++)
        rows.push([xvals[c], yvals[r], fg.colVals[ci] ?? '', fg.rowVals[ri] ?? '',
                   names, seeds, zs[r][c], zm[r][c]].map(csvCell).join(','));
  }));
  const blob = new Blob([rows.join('\n') + '\n'], {type: 'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${cmpDownloadName()}_grid.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function renderCompareChart(result) {
  lastCompareResult = result;
  if (result && result.kind === 'grid_heatmap') { setupGridHeatmap(result); return; }
  clearChartPlaceholder();
  document.getElementById('cmp-grid-controls').style.display = 'none';
  const x = result.x;
  // X-axis spans the actual swept range so changing sweep_min/sweep_max and
  // regenerating rescales the axis with the data, rather than leaving it pinned
  // to a fixed per-channel default that just clips the lines.
  const xmin = x.length ? x[0] : undefined;
  const xmax = x.length ? x[x.length - 1] : undefined;
  const traces = [];
  const bandForLine = {};   // line trace index -> its band trace index (if any)
  result.policies.forEach((p, i) => {
    const color = CMP_COLORS[i % CMP_COLORS.length];
    // min-max band (skip when a single seed has no spread)
    let bandIdx = null;
    if (p.n_seeds > 1) {
      bandIdx = traces.length;
      traces.push({
        x: [...x, ...x.slice().reverse()],
        y: [...p.max, ...p.min.slice().reverse()],
        fill: 'toself', fillcolor: color + '25', line: {color: 'transparent'},
        type: 'scatter', mode: 'none', showlegend: false, hoverinfo: 'skip',
      });
    }
    if (bandIdx != null) bandForLine[traces.length] = bandIdx;
    traces.push({
      x, y: p.mean, type: 'scatter', mode: 'lines',
      name: `${p.label} (n=${p.n_seeds} seed${p.n_seeds === 1 ? '' : 's'})`,
      line: {color, width: 2},
    });
  });

  const shapes = [], annotations = [];
  if (result.ref) {
    shapes.push({
      type: 'line', x0: result.ref.value, x1: result.ref.value, y0: 0, y1: 100,
      line: {color: '#9ca3af', dash: 'dash', width: 1},
    });
    if (result.ref.label) annotations.push({
      x: result.ref.value, y: 100, yanchor: 'bottom', text: result.ref.label,
      showarrow: false, font: {size: 9, color: '#9ca3af'},
    });
  }

  const skipNote = `skip first ${result.skip_first ?? 0}s (${result.skip_steps ?? 0} steps)`;
  const critNote =
    result.success_mode === 'average' ? `avg error below thr · ${skipNote}`
    : result.success_mode === 'average_above' ? `mean metric above thr · ${skipNote}`
    : `hold ${result.hold_steps} steps`;
  const layout = {
    ...basePlotLayout(result.title || `Success rate vs threshold · ${critNote}`),
    showlegend: true,
    margin: {l: 50, r: 10, t: 28, b: 44},
    xaxis: {
      title: {text: result.xlabel, font: {size: 11}}, gridcolor: '#374151',
      range: xmin != null ? [xmin, xmax] : undefined,
    },
    yaxis: {title: {text: result.ylabel, font: {size: 11}}, gridcolor: '#374151', range: [0, 100]},
    legend: {font: {size: 10}},
    shapes, annotations,
  };
  Plotly.react('cmp-chart', traces, layout, plotCfg);
  document.getElementById('cmp-dl').disabled = false;        // PNG now downloadable
  document.getElementById('cmp-dl-data').disabled = false;   // CSV now downloadable
  // Toggling a policy's line in the legend should also hide/show its min-max
  // band. Pairing is irregular (band only when n_seeds > 1), so look it up.
  const cmpDiv = document.getElementById('cmp-chart');
  cmpDiv._bandForLine = bandForLine;
  if (!cmpDiv._bandToggleWired) {
    cmpDiv._bandToggleWired = true;
    cmpDiv.on('plotly_legendclick', (ev) => {
      const band = cmpDiv._bandForLine[ev.curveNumber];
      if (band == null) return true;
      const lineVisible = cmpDiv.data[ev.curveNumber].visible !== 'legendonly';
      Plotly.restyle(cmpDiv, {visible: lineVisible ? 'legendonly' : true}, [band]);
      return true;  // keep Plotly's default toggle on the clicked line
    });
  }
  setTimeout(resizeCompareChart, 0);
}

// ── grid heatmap ─────────────────────────────────────────────────────────────
// The grid benchmark ships a per-cell metric over the full randomization grid
// (all axes). The viz is pivoted client-side so choosing a different axis pair
// is instant — no re-collect, no server round-trip.
//
// Two kinds of axis can go on X/Y. A *randomization* axis (result.axes) varies
// within a policy's rollouts — its index comes from the cell. A *policy* axis
// (result.policy_axes: a config knob the dataset's policies differ by, e.g. the
// PD gains) is constant per policy, so putting one on an axis pools the cells of
// every policy sharing that value. Both live in one flat list; a dropdown value
// is an index into it, randomization axes first.
//
// With randomization on both heatmap axes there is one panel per policy, and a
// sweep holds dozens: 45 policies (5 sensor bundles × 3 kp × 3 kv) flowed two
// wide is a 23-row scroll with nothing lined up. So the panel *wall* is itself a
// grid over policy axes — "facets": one panel column per value of the column
// facet, one row per value of the row facet, values written once on the bands
// rather than as a policy name over every panel. Reading across a row is then
// the kp comparison, and down a column the kv one. Any policy axis on neither
// heatmap axis nor a facet becomes a "page": pooled by default, but visibly so.
const GRID_NONE = '__none__';   // Y-axis / facet "(none)" option
let gridSel = {x: null, y: null};   // remembered by axis id, across re-renders
// Facet axes, also by id (a dataset switch invalidates indices, not ids).
let facetSel = {col: GRID_NONE, row: GRID_NONE};
let facetInit = false;          // slug the facets were last defaulted for (false: never)
// Free policy axes: name -> '' (pool every value into each panel) | a value.
let pageSel = {};
let gridRef = null;             // {c, r} facet cell every panel is differenced from
let summaryPrev = null;         // X/Y/facets stashed while collapsed to summary

function allAxes() {
  const r = lastCompareResult || {};
  return [
    ...(r.axes || []).map(a => ({...a, group: 'grid', id: 'grid:' + a.name})),
    ...(r.policy_axes || []).map(a => ({...a, group: 'policy', id: 'policy:' + a.name})),
  ];
}
function nGridAxes() { return ((lastCompareResult || {}).axes || []).length; }
function isPolicyAxis(i) { return i >= nGridAxes(); }
function axisLen(i) { return allAxes()[i].values.length; }

// Plotly coordinates for an axis. Policy-axis values are discrete settings, not
// positions, so they go on as categories — kp ∈ {2, 4, 8} gets three equal
// columns rather than a gap-scaled numeric axis.
function axisTicks(i) {
  const ax = allAxes()[i];
  return ax.group === 'policy' ? ax.values.map(String) : ax.values;
}
function axisIndexById(id) { return allAxes().findIndex(a => a.id === id); }
function policyAxisIndices() {
  return allAxes().map((a, i) => i).filter(i => isPolicyAxis(i));
}

// ── facets ───────────────────────────────────────────────────────────────────
// A facet axis is a policy axis not already spent on X or Y. Resolved fresh on
// every render: the same remembered id can stop being facetable when the user
// moves that knob onto a heatmap axis.
function facetIndex(kind, xi, yi) {
  const id = facetSel[kind];
  if (id === GRID_NONE) return -1;
  const i = axisIndexById(id);
  if (i < 0 || !isPolicyAxis(i) || i === xi || i === yi) return -1;
  if (kind === 'row' && facetSel.col === id) return -1;   // one axis, one band
  return i;
}

// Facet defaults, once per dataset: the policy axes with the fewest values fill
// columns then rows, so the widest factor is the one left as pages rather than
// the one squeezing every panel narrow. The user's picks survive regenerates.
function defaultFacets(slug) {
  if (facetInit === slug) {
    // A remembered facet axis this render has no axis for (a restored view can
    // predate a re-collect) would silently band nothing — fall back to the
    // defaults rather than to an unexplained flat wall.
    const stale = k => facetSel[k] !== GRID_NONE && axisIndexById(facetSel[k]) < 0;
    if (!stale('col') && !stale('row')) return;
  }
  facetInit = slug;
  const AX = allAxes();
  const pol = policyAxisIndices()
    .map(i => ({i, n: AX[i].values.length}))
    .sort((a, b) => a.n - b.n || a.i - b.i);
  facetSel = {col: pol[0] ? AX[pol[0].i].id : GRID_NONE,
              row: pol[1] ? AX[pol[1].i].id : GRID_NONE};
  pageSel = {};
  gridRef = null;
  summaryPrev = null;
}

// Policies surviving the page selection. `used` names the policy axes already
// spoken for by X/Y/facets — those are laid out, not filtered.
function pagedPolicies(pols, used) {
  const free = policyAxisIndices().map(i => allAxes()[i]).filter(a => !used.has(a.name));
  if (!free.length) return pols;
  return pols.filter(p =>
    free.every(a => !pageSel[a.name] || attrValue(p, a.name) === pageSel[a.name]));
}

// The panel matrix. `cells[r][c]` is null for a slot no policy fills; `colAx` /
// `rowAx` null means that band has no facet, and with neither the panels fall
// back to one per policy (flowed two wide, titled by name) — what the tab did
// before facets, and still what a dataset with no policy axes gets.
function facetGrid(pols, xi, yi) {
  const AX = allAxes();
  // A policy axis on X or Y *is* the policies laid out: they pool into one panel.
  const merged = isPolicyAxis(xi) || (yi >= 0 && isPolicyAxis(yi));
  const ci = merged ? -1 : facetIndex('col', xi, yi);
  const ri = merged ? -1 : facetIndex('row', xi, yi);
  const used = new Set();
  [xi, yi, ci, ri].forEach(i => { if (i >= 0 && isPolicyAxis(i)) used.add(AX[i].name); });
  const shown = pagedPolicies(pols, used);
  const badge = (ps) => {
    const seeds = ps.reduce((a, p) => a + p.n_seeds, 0);
    return ps.length > 1 ? `${ps.length} pol · n=${seeds}` : `n=${seeds}`;
  };
  if (merged) {
    const seeds = shown.reduce((a, p) => a + p.n_seeds, 0);
    return {merged: true, colAx: null, rowAx: null, used,
            colVals: [null], rowVals: [null],
            cells: [[{pols: shown, title: `${shown.length} policies · ${seeds} seeds`}]]};
  }
  const colAx = ci >= 0 ? AX[ci] : null;
  const rowAx = ri >= 0 ? AX[ri] : null;
  if (!colAx && !rowAx) {
    // With both heatmap axes on randomization (Y actually set, not (none)) the
    // panels are one-per-policy thumbnails, so flow them 4 wide; otherwise 2.
    const bothRand = yi >= 0 && !isPolicyAxis(xi) && !isPolicyAxis(yi);
    const cols = Math.max(1, Math.min(shown.length, bothRand ? 4 : 2));
    const cells = [];
    shown.forEach((p, k) => {
      const r = Math.floor(k / cols);
      cells[r] = cells[r] || new Array(cols).fill(null);
      cells[r][k % cols] = {pols: [p], title: `${p.label} (n=${p.n_seeds})`};
    });
    const grid = cells.length ? cells : [[null]];
    return {merged: false, colAx: null, rowAx: null, used,
            colVals: new Array(cols).fill(null), rowVals: grid.map(() => null),
            cells: grid};
  }
  const colVals = colAx ? colAx.values.map(String) : [null];
  const rowVals = rowAx ? rowAx.values.map(String) : [null];
  const cells = rowVals.map(rv => colVals.map(cv => {
    const ps = shown.filter(p =>
      (!colAx || attrValue(p, colAx.name) === cv) &&
      (!rowAx || attrValue(p, rowAx.name) === rv));
    return ps.length ? {pols: ps, badge: badge(ps)} : null;
  }));
  return {merged: false, colAx, rowAx, colVals, rowVals, cells, used};
}

function setupGridHeatmap(result) {
  const axes = allAxes();
  const xSel = document.getElementById('grid-x');
  const ySel = document.getElementById('grid-y');
  const nGrid = nGridAxes();
  const opt = (a, i) => `<option value="${i}">${a.label}</option>`;
  const gridOpts = axes.slice(0, nGrid).map(opt).join('');
  const polOpts = axes.slice(nGrid)
    .map((a, i) => opt(a, nGrid + i)).join('');
  const axOpts = polOpts
    ? `<optgroup label="randomization">${gridOpts}</optgroup>` +
      `<optgroup label="policy">${polOpts}</optgroup>`
    : gridOpts;
  xSel.innerHTML = axOpts;
  ySel.innerHTML = `<option value="${GRID_NONE}">(none)</option>` + axOpts;

  // Keep the user's picks across regenerates when still valid, else default to
  // the first two axes (grid_collect orders episode axes first, so X=primary).
  const ids = axes.map(a => a.id);
  let xi = ids.indexOf(gridSel.x);
  if (xi < 0) xi = 0;
  let yi = ids.indexOf(gridSel.y);
  if (gridSel.y !== GRID_NONE && yi < 0) yi = nGrid > 1 ? (xi === 0 ? 1 : 0) : -1;
  if (yi === xi) yi = -1;
  xSel.value = String(xi);
  ySel.value = yi < 0 ? GRID_NONE : String(yi);

  defaultFacets(currentDataset ? currentDataset.slug : null);
  document.getElementById('cmp-grid-controls').style.display = 'flex';
  renderGridHeatmap();
}

// Enforce distinct X/Y (a heatmap axis against itself is meaningless): if the
// user picks the axis already on the other dropdown, swap them.
function onGridAxisChange(which) {
  const xSel = document.getElementById('grid-x');
  const ySel = document.getElementById('grid-y');
  if (ySel.value !== GRID_NONE && ySel.value === xSel.value) {
    if (which === 'x') ySel.value = gridSel.xIdx != null ? String(gridSel.xIdx) : GRID_NONE;
    else xSel.value = gridSel.yIdx != null ? String(gridSel.yIdx) : xSel.value;
  }
  gridRef = null;          // panels are a different set now — its cell is gone
  summaryPrev = null;      // a hand-picked pair isn't "the summary" to toggle out of
  renderGridHeatmap();
}

function onFacetChange(kind) {
  const other = kind === 'col' ? 'row' : 'col';
  const val = document.getElementById(kind === 'col' ? 'grid-fcol' : 'grid-frow').value;
  // One axis can't band both ways: taking the other band's axis swaps them.
  if (val !== GRID_NONE && facetSel[other] === val) facetSel[other] = facetSel[kind];
  facetSel[kind] = val;
  gridRef = null;
  renderGridHeatmap();
}

function onGridRefChange() {
  const v = document.getElementById('grid-ref').value;
  gridRef = v === GRID_NONE ? null : {c: +v.split(':')[0], r: +v.split(':')[1]};
  renderGridHeatmap();
}

// vi < 0 pools the axis again; clicking the value already shown does the same.
function onPageChip(ai, vi) {
  const ax = allAxes()[ai];
  if (!ax) return;
  const val = vi < 0 ? '' : String(ax.values[vi]);
  pageSel[ax.name] = pageSel[ax.name] === val ? '' : val;
  gridRef = null;
  renderGridHeatmap();
}

// Collapse to summary: put the policy axes themselves on X/Y, so the whole
// randomization grid marginalises into one cell per policy setting — the
// overview the facet matrix is the drill-down of. Toggles back to the pair and
// facets it replaced.
function toggleSummary() {
  const pol = policyAxisIndices();
  const xSel = document.getElementById('grid-x');
  const ySel = document.getElementById('grid-y');
  if (summaryPrev) {
    const xi = axisIndexById(summaryPrev.x);
    const yi = axisIndexById(summaryPrev.y);
    xSel.value = String(xi < 0 ? 0 : xi);
    ySel.value = yi < 0 ? GRID_NONE : String(yi);
    facetSel = {col: summaryPrev.col, row: summaryPrev.row};
    summaryPrev = null;
  } else {
    if (!pol.length) return;
    summaryPrev = {x: gridSel.x, y: gridSel.y, col: facetSel.col, row: facetSel.row};
    xSel.value = String(pol[0]);
    ySel.value = pol[1] != null ? String(pol[1]) : GRID_NONE;
  }
  gridRef = null;
  renderGridHeatmap();
}

// Rebuild the facet / reference / page controls for the axes still free. Option
// lists are rewritten only when their content actually changes, so re-rendering
// (a resize re-runs the whole draw) doesn't fight the user's open dropdown.
function syncGridControls(xi, yi, fg) {
  const AX = allAxes();
  const setOpts = (el, html) => {
    if (el.dataset.sig !== html) { el.dataset.sig = html; el.innerHTML = html; }
  };
  const free = policyAxisIndices().filter(i => i !== xi && i !== yi);
  const facetOpts = `<option value="${GRID_NONE}">(none)</option>` +
    free.map(i => `<option value="${AX[i].id}">${AX[i].label}</option>`).join('');
  const fcol = document.getElementById('grid-fcol');
  const frow = document.getElementById('grid-frow');
  setOpts(fcol, facetOpts);
  setOpts(frow, facetOpts);
  const ci = facetIndex('col', xi, yi), ri = facetIndex('row', xi, yi);
  fcol.value = ci >= 0 ? AX[ci].id : GRID_NONE;
  frow.value = ri >= 0 ? AX[ri].id : GRID_NONE;
  // A policy axis on X/Y already lays the policies out — nothing left to facet.
  fcol.disabled = frow.disabled = fg.merged || !free.length;

  // Reference: one option per filled facet cell, named by its facet coordinates.
  const refEl = document.getElementById('grid-ref');
  const opts = [`<option value="${GRID_NONE}">(none)</option>`];
  if (!fg.merged && (fg.colAx || fg.rowAx)) {
    fg.cells.forEach((row, r) => row.forEach((cell, c) => {
      if (!cell) return;
      const parts = [];
      if (fg.colAx) parts.push(`${fg.colAx.label}=${fg.colVals[c]}`);
      if (fg.rowAx) parts.push(`${fg.rowAx.label}=${fg.rowVals[r]}`);
      opts.push(`<option value="${c}:${r}">${parts.join(' · ')}</option>`);
    }));
  }
  setOpts(refEl, opts.join(''));
  refEl.disabled = opts.length < 2;
  refEl.value = gridRef ? `${gridRef.c}:${gridRef.r}` : GRID_NONE;
  if (refEl.selectedIndex < 0) { refEl.value = GRID_NONE; gridRef = null; }

  const btn = document.getElementById('grid-summary');
  btn.textContent = summaryPrev ? '⊟ back to matrix' : '⊞ collapse to summary';
  btn.style.display = policyAxisIndices().length ? '' : 'none';

  // Pages: every policy axis neither laid out nor faceted. Pooled by default —
  // the chips make that visible and let one value be isolated in a click.
  const paged = policyAxisIndices().filter(i => !fg.used.has(AX[i].name));
  document.getElementById('grid-pages').innerHTML = paged.map(i => {
    const a = AX[i];
    const chips = a.values.map((v, vi) => {
      const on = pageSel[a.name] === String(v) ? ' on' : '';
      return `<button class="pol-chip${on}" onclick="onPageChip(${i}, ${vi})">${v}</button>`;
    }).join('');
    const pooled = pageSel[a.name] ? '' : ' on';
    return `<span class="pol-attr"><span>${a.label}</span>` +
           `<button class="pol-chip${pooled}" onclick="onPageChip(${i}, -1)" ` +
           `title="average every value into each panel">pooled</button>${chips}</span>`;
  }).join('');
}

// Marginalize: average the per-cell metric over every axis except (xi, yi),
// pooling the given policies. yi < 0 collapses to a single row (X axis only).
const AX_CELL = -1;      // randomization axis: the index comes from the cell
const AX_MISSING = -2;   // this policy's config has no such attribute
function pivotCells(pols, xi, yi, metricKey) {
  const AX = allAxes(), nGrid = nGridAxes();
  const polIdx = (p, i) => {
    if (i < 0 || i < nGrid) return AX_CELL;
    const ax = AX[i], v = attrValue(p, ax.name);
    const k = ax.values.findIndex(x => String(x) === v);
    return k < 0 ? AX_MISSING : k;
  };
  const nx = axisLen(xi), ny = yi < 0 ? 1 : axisLen(yi);
  const sum = Array.from({length: ny}, () => new Float64Array(nx));
  const cnt = Array.from({length: ny}, () => new Float64Array(nx));
  pols.forEach(p => {
    const px = polIdx(p, xi), py = polIdx(p, yi);
    if (px === AX_MISSING || py === AX_MISSING) return;   // not on this axis
    const metric = p[metricKey], ci = p.cell_index;
    for (let c = 0; c < metric.length; c++) {
      if (metric[c] == null) continue;   // empty sampled bin — don't poison the mean
      const ix = px === AX_CELL ? ci[c][xi] : px;
      const iy = yi < 0 ? 0 : (py === AX_CELL ? ci[c][yi] : py);
      sum[iy][ix] += metric[c]; cnt[iy][ix] += 1;
    }
  });
  return sum.map((row, r) =>
    Array.from(row, (v, cc) => (cnt[r][cc] ? v / cnt[r][cc] : null)));
}

// ── panel geometry ───────────────────────────────────────────────────────────
// A lone panel keeps the axis-length ratio of a single full-pane plot. Once
// there are several, that ratio would flatten every panel as rows pile up, so
// faceted panels take the shape of the data instead (an 8×8 grid draws square)
// and the figure grows as tall as the matrix demands, scrolling in #cmp-chart.
// Interior ticks are dropped in facet mode — only the bottom row carries x ticks
// and only the left column y ticks — which is what pays for the extra columns.
const GRID_MARGIN = {l: 55, r: 88, t: 40, b: 48};   // r houses the colorbar
const GRID_GAP_X = 62;   // px between columns — the right panel's y ticks + title
const GRID_GAP_Y = 54;   // px between rows — x ticks + the next panel's title
const FACET_GAP_X = 20;  // interior y ticks are suppressed, so panels sit close
const FACET_GAP_Y = 30;
const FACET_HEAD_TOP = 16;    // band holding the column-facet values
const FACET_HEAD_LEFT = 24;   // band holding the row-facet values (rotated)
const MAX_PANEL_W = 460;      // a 1-column matrix shouldn't grow a page tall
const gridPlotCfg = {responsive: false, displayModeBar: false};
let gridSizedFor = {w: 0, h: 0};   // pane size the current figure was built for

function gridGeometry(cols, rows, opt) {
  const {nx, ny, gapX, gapY, headTop, headLeft} = opt;
  const el = document.getElementById('cmp-chart');
  const rawW = el.clientWidth, rawH = el.clientHeight;
  const W0 = Math.max(420, rawW);
  const H0 = Math.max(300, rawH);
  const m = {l: GRID_MARGIN.l + headLeft, r: GRID_MARGIN.r,
             t: GRID_MARGIN.t + headTop, b: GRID_MARGIN.b};
  const single = cols === 1 && rows === 1;
  // One panel: fill the pane, exactly as the single-policy view always has.
  // Several: shape them like the cell grid they hold, clamped so a 1×N sweep
  // stays a readable strip rather than a hairline or a tower.
  const ratio = single ? (W0 - m.l - m.r) / (H0 - m.t - m.b)
                       : Math.min(4, Math.max(0.55, nx / Math.max(1, ny)));
  const availW = W0 - m.l - m.r - gapX * (cols - 1);
  const panelW = single ? availW : Math.min(availW / cols, MAX_PANEL_W);
  const panelH = panelW / ratio;
  // Plotly domains are fractions of the area inside the margins, and that area
  // is by construction exactly the panels plus their gaps.
  const spanW = panelW * cols + gapX * (cols - 1);
  const spanH = panelH * rows + gapY * (rows - 1);
  return {
    rawW, rawH, panelW, panelH, spanW, spanH, margin: m,
    W: m.l + m.r + spanW,
    figH: m.t + m.b + spanH,
    xDomain: (col) => {
      const x0 = col * (panelW + gapX);
      return [x0 / spanW, (x0 + panelW) / spanW];
    },
    // Rows are laid out top-down; Plotly's y fractions run bottom-up.
    yDomain: (row) => {
      const top = row * (panelH + gapY);
      return [1 - (top + panelH) / spanH, 1 - top / spanH];
    },
  };
}

// Null-safe elementwise difference of two pivots (the Δ-vs-reference view).
function diffPivot(z, zref) {
  return z.map((row, r) => row.map((v, c) =>
    (v == null || zref[r][c] == null) ? null : v - zref[r][c]));
}

function renderGridHeatmap() {
  const result = lastCompareResult;
  if (!result || result.kind !== 'grid_heatmap') return;
  const axes = allAxes();
  const xi = parseInt(document.getElementById('grid-x').value);
  const ySelVal = document.getElementById('grid-y').value;
  const yi = ySelVal === GRID_NONE ? -1 : parseInt(ySelVal);
  gridSel = {x: axes[xi].id, y: yi < 0 ? GRID_NONE : axes[yi].id,
             xIdx: xi, yIdx: yi < 0 ? null : yi};

  // The heatmap always colours by success rate for the selected channel; the
  // channel-mean travels along in the tooltip (customdata) instead of a
  // separate metric dropdown.
  const metrics = result.metrics || [];
  const metricDef = metrics.find(m => m.key === 'success')
    || {label: 'success rate (%)', zmin: 0, zmax: 100};
  const meanLabel = (metrics.find(m => m.key === 'mean') || {}).label || 'mean';
  const pols = result.policies || [];
  if (!pols.length) {
    Plotly.purge('cmp-chart');
    document.getElementById('cmp-chart').innerHTML =
      '<div class="cmp-placeholder">No grid data.</div>';
    return;
  }
  clearChartPlaceholder();

  // Category ticks are drawn verbatim, so round numeric sweep values to 2 dp for
  // the label — a geometric axis (e.g. target frequency) otherwise prints values
  // like 0.7071068. Policy ticks are already strings and pass through untouched.
  const fmtTick = v => typeof v === 'number' && isFinite(v) ? v.toFixed(2) : v;
  const xvals = axisTicks(xi).map(fmtTick);
  const yvals = yi < 0 ? [axes[xi].label] : axisTicks(yi).map(fmtTick);

  const fg = facetGrid(pols, xi, yi);
  syncGridControls(xi, yi, fg);
  const faceted = !!(fg.colAx || fg.rowAx);
  const rows = fg.cells.length, cols = fg.colVals.length;

  // Every slot gets a subplot in facet mode — an empty one keeps the matrix
  // aligned under its headers. The per-policy flow just skips its trailing hole.
  const slots = [];
  fg.cells.forEach((row, r) => row.forEach((cell, c) => {
    if (!cell && !faceted) return;
    slots.push({r, c, cell, n: slots.length + 1});
  }));
  if (!slots.some(s => s.cell)) {
    Plotly.purge('cmp-chart');
    document.getElementById('cmp-chart').innerHTML =
      '<div class="cmp-placeholder">No policies match the current page selection.</div>';
    document.getElementById('cmp-dl').disabled = true;
    document.getElementById('cmp-dl-data').disabled = true;
    return;
  }

  slots.forEach(s => {
    if (!s.cell) return;
    s.z = pivotCells(s.cell.pols, xi, yi, 'success');
    s.mean = pivotCells(s.cell.pols, xi, yi, 'mean');
  });
  // Δ mode: every panel is shown as its difference from the reference cell, on a
  // diverging scale centred at 0 — "did raising kp help, and where", instead of
  // two viridis panels held side by side.
  const ref = gridRef && fg.cells[gridRef.r] && fg.cells[gridRef.r][gridRef.c]
    ? slots.find(s => s.r === gridRef.r && s.c === gridRef.c) : null;
  const refName = ref ? [
    fg.colAx ? `${fg.colAx.label}=${fg.colVals[ref.c]}` : '',
    fg.rowAx ? `${fg.rowAx.label}=${fg.rowVals[ref.r]}` : '',
  ].filter(Boolean).join(' · ') : '';
  if (ref) slots.forEach(s => { if (s.cell) s.dz = diffPivot(s.z, ref.z); });

  // Shared colour range so subplots are comparable. Success is fixed 0–100; an
  // open-ended metric (mean) is scaled to the data across all panels, and a Δ is
  // symmetric about 0 so equal gains and losses read equally strong.
  const zKey = ref ? 'dz' : 'z';
  let zmin = ref ? null : metricDef.zmin, zmax = ref ? null : metricDef.zmax;
  if (zmin == null || zmax == null) {
    let lo = Infinity, hi = -Infinity;
    slots.forEach(s => (s[zKey] || []).forEach(row => row.forEach(v => {
      if (v == null) return; if (v < lo) lo = v; if (v > hi) hi = v;
    })));
    if (lo === Infinity) { lo = 0; hi = 1; }
    if (ref) { const m = Math.max(Math.abs(lo), Math.abs(hi)) || 1; lo = -m; hi = m; }
    zmin = zmin == null ? lo : zmin;
    zmax = zmax == null ? hi : zmax;
  }

  const geo = gridGeometry(cols, rows, {
    nx: xvals.length, ny: yvals.length,
    gapX: faceted ? FACET_GAP_X : GRID_GAP_X,
    gapY: faceted ? FACET_GAP_Y : GRID_GAP_Y,
    headTop: fg.colAx ? FACET_HEAD_TOP : 0,
    headLeft: fg.rowAx ? FACET_HEAD_LEFT : 0,
  });
  const xTitle = axes[xi].label;
  const yTitle = yi < 0 ? '' : axes[yi].label;
  const zLabel = ref ? `Δ ${metricDef.label}` : metricDef.label;
  const blank = yvals.map(() => xvals.map(() => null));
  const firstFilled = slots.find(s => s.cell);
  const traces = [], annotations = [];
  slots.forEach((s) => {
    const n = s.n;                         // Plotly axis suffix (x/y, x2/y2, …)
    if (!s.cell) {
      // Placeholder: no policy trained at this combination. Draws nothing but
      // keeps the slot's axes — and so the matrix's alignment — in place.
      traces.push({type: 'heatmap', z: blank, x: xvals, y: yvals,
                   xaxis: 'x' + n, yaxis: 'y' + n, showscale: false,
                   hoverinfo: 'skip'});
      return;
    }
    traces.push({
      type: 'heatmap', z: ref ? s.dz : s.z, x: xvals, y: yvals,
      // Under a reference the raw rate rides along in the tooltip, so a panel
      // still says what it scored, not only how far it moved.
      customdata: s.mean.map((row, r) => row.map((m, c) => [s.z[r][c], m])),
      xaxis: 'x' + n, yaxis: 'y' + n,
      // What centres the diverging scale on 0 is the symmetric zmin/zmax below —
      // `zmid` is ignored once those are given (it only acts when zauto is on).
      zmin, zmax, colorscale: ref ? 'RdBu' : 'Viridis', zsmooth: false,
      xgap: 1, ygap: 1,
      showscale: s === firstFilled,
      // Pinned in pixels to the top-right: a fraction-of-figure length would
      // stretch into a full-height bar once the figure grows past the pane.
      colorbar: {title: {text: zLabel, side: 'right', font: {size: 10}},
                 thickness: 12, tickfont: {size: 9},
                 lenmode: 'pixels', len: Math.min(240, geo.panelH),
                 x: 1.005, xanchor: 'left', y: 1, yanchor: 'top'},
      hovertemplate:
        `${xTitle}: %{x}<br>` +
        (yi < 0 ? '' : `${yTitle}: %{y}<br>`) +
        (ref ? `Δ: %{z:+.3g}<br>${metricDef.label}: %{customdata[0]:.3g}<br>`
             : `${metricDef.label}: %{z:.3g}<br>`) +
        `${meanLabel}: %{customdata[1]:.3g}<extra></extra>`,
    });
    if (faceted) {
      // Faceted panels are named by their position on the bands, so all a panel
      // carries is how much data stands behind it (and the reference marker).
      annotations.push({
        text: s === ref ? `${s.cell.badge} · reference` : s.cell.badge,
        xref: 'x' + n + ' domain', yref: 'y' + n + ' domain',
        x: 1, y: 1, xanchor: 'right', yanchor: 'bottom', yshift: 1,
        showarrow: false, font: {size: 8, color: s === ref ? '#93c5fd' : '#6b7280'},
      });
    } else {
      annotations.push({
        text: s.cell.title,
        xref: 'x' + n + ' domain', yref: 'y' + n + ' domain',
        x: 0.5, y: 1.0, yanchor: 'bottom', showarrow: false,
        font: {size: 10, color: '#e5e7eb'},
      });
    }
  });

  // Facet values, written once per band instead of once per panel: reading along
  // a band is the comparison that band's knob makes.
  if (fg.colAx) {
    fg.colVals.forEach((v, c) => {
      const s = slots.find(t => t.r === 0 && t.c === c);
      if (!s) return;
      annotations.push({
        text: `${fg.colAx.label} = ${v}`,
        xref: 'x' + s.n + ' domain', x: 0.5,
        yref: 'paper', y: 1, yanchor: 'bottom', yshift: 12,
        showarrow: false, font: {size: 11, color: '#e5e7eb'},
      });
    });
  }
  if (fg.rowAx) {
    // paper x = 0 is the left edge of the panels; step back into the band the
    // geometry reserved for these labels (margin is in px, paper is a fraction).
    const xHead = -(geo.margin.l - 12) / geo.spanW;
    fg.rowVals.forEach((v, r) => {
      const s = slots.find(t => t.c === 0 && t.r === r);
      if (!s) return;
      annotations.push({
        text: `${fg.rowAx.label} = ${v}`,
        yref: 'y' + s.n + ' domain', y: 0.5,
        xref: 'paper', x: xHead, xanchor: 'center', yanchor: 'middle',
        textangle: -90, showarrow: false, font: {size: 11, color: '#e5e7eb'},
      });
    });
  }

  const thrNote = result.channel
    ? `${result.channel} · thr ${(+result.threshold).toPrecision(3)}`
    : '';
  const title = (ref ? `Grid — ${zLabel} vs ${refName}` : `Grid — ${metricDef.label}`)
    + (thrNote ? '  ·  ' + thrNote : '');
  const base = basePlotLayout(title);
  const layout = {
    ...base,
    // Pinned to the very top of the figure so the column-facet band can sit
    // directly above the panels without the two colliding.
    title: {...base.title, yref: 'container', y: 1, yanchor: 'top', pad: {t: 6}},
    // No `grid`: it splits the paper evenly, so extra rows just flatten every
    // panel. Explicit domains (below) hold each panel to the shape it should be.
    margin: geo.margin,
    width: geo.W, height: geo.figH, autosize: false,
    showlegend: false,
    annotations,
  };
  // Per-subplot domain + axis titles. Titles ride on the outer edges only, and
  // in facet mode so do the tick labels — every panel spans the same axes, so
  // repeating them per panel only spends the width the columns need. Domains are
  // fractions of the area inside the margins, exactly what gridGeometry laid the
  // panels out over.
  slots.forEach((s) => {
    const n = s.n, bottom = s.r === rows - 1, left = s.c === 0;
    layout['xaxis' + (n === 1 ? '' : n)] = {
      title: {text: bottom ? xTitle : '', font: {size: 10}},
      gridcolor: '#374151', tickfont: {size: 9}, zeroline: false,
      showticklabels: faceted ? bottom : true,
      // Every sampled value gets an equal band, not a gap-scaled numeric
      // position: a log2/geometric axis (e.g. target frequency) would otherwise
      // give bricks of different heights. Category keeps all cells the same size
      // while the tick labels still read out the real values.
      type: 'category',
      domain: geo.xDomain(s.c), anchor: 'y' + n,
    };
    layout['yaxis' + (n === 1 ? '' : n)] = {
      title: {text: left && yi >= 0 ? yTitle : '', font: {size: 10}},
      gridcolor: '#374151', tickfont: {size: 9}, zeroline: false,
      showticklabels: yi >= 0 && (faceted ? left : true),
      type: 'category',
      domain: geo.yDomain(s.r), anchor: 'x' + n,
    };
  });

  gridSizedFor = {w: geo.rawW, h: geo.rawH};
  // responsive:true would stretch the svg back to the container on resize and
  // undo the explicit height; resizeCompareChart re-derives the geometry instead.
  Plotly.react('cmp-chart', traces, layout, gridPlotCfg);
  document.getElementById('cmp-dl').disabled = false;
  document.getElementById('cmp-dl-data').disabled = false;

  // What the panels hide: the unshown randomization axes always, plus every
  // policy knob that is neither laid out, faceted, nor pinned to a page.
  const laid = new Set([xi, yi].filter(k => k >= 0).map(k => axes[k].name));
  const avg = axes.filter(a => {
    if (laid.has(a.name)) return false;
    if (a.group === 'grid') return true;
    if (fg.merged) return true;
    if ((fg.colAx && fg.colAx.name === a.name) || (fg.rowAx && fg.rowAx.name === a.name)) return false;
    return !pageSel[a.name];
  });
  const pinned = axes.filter(a =>
    a.group === 'policy' && pageSel[a.name] && !fg.used.has(a.name));
  const parts = [];
  if (avg.length) parts.push('averaged over ' + avg.map(a => a.name).join(', '));
  if (pinned.length) parts.push('showing ' +
    pinned.map(a => `${a.label} = ${pageSel[a.name]}`).join(', '));
  if (ref) parts.push(`Δ vs ${refName}`);
  document.getElementById('grid-hint').textContent = parts.join('  ·  ');
  saveViewState();   // the pivot is part of the view this dataset comes back to
  setTimeout(resizeCompareChart, 0);
}

// ── start ─────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
