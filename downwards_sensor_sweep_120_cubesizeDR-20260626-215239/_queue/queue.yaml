# DownwardsRotateZ — sensor-bundle sweep at max_target_angle = 120deg, NO curriculum,
# WITH cube-size domain randomization (the treatment vs the no-DR control sweep
# `downwards_sensor_sweep_120`).
#
# domain_randomization=true activates the env's domain_randomize, which has been
# made CUBE-SIZE-ONLY (per-env cube geom scaled in [0.85, 1.15]; verified
# collision-free in the home pose). No other axis is randomized, so cube size is
# the single variable changed vs the control — isolating whether size DR makes the
# force-informed bundle (force.magnitude) separate from the force-blind ones in
# size robustness.
#
# Everything else is held identical to the control: absolute + EMA0.2 control,
# 120deg full-range goals, curriculum off, 1B steps. SINGLE SEED (0).
# 4 bundles x 1 seed = 4 runs. One queue, one GPU; launch via the cockpit.
defaults:
  flags:
    use_wandb: true
    log_video_to_wandb: true
    log_training_metrics: true
    training_metrics_steps: 20_000_000
    num_timesteps: 1_000_000_000
    full_reset: true
    num_resets_per_eval: 0
    domain_randomization: true
  env_overrides:
    # 120 deg in radians (max_target_angle is stored in radians).
    max_target_angle: 2.0943951023931953
    action_mode: absolute
    ema_alpha: 0.2
    target_hold_time: 0.05
    curriculum:
      enable: false

sweep:
  env_names: [TesolloDownwardsRotateZ]
  params:
    sensor_bundle:
      values: [force.magnitude, baseline, proprio.delta, proprio.target]
  seeds: [0]
